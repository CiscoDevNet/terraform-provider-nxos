test_prerequisites:
  - dn: sys/fm/epbr
    class_name: fmEpbr
    no_delete: true
    attributes:
      - name: adminSt
        value: enabled
  - dn: sys/intf/lb-[lo123]
    class_name: l3LbRtdIf
    attributes:
      - name: id
        value: lo123
  - dn: sys/intf/phys-[eth1/10]
    class_name: l1PhysIf
    attributes:
      - name: layer
        value: Layer3
  - dn: sys/intf/phys-[eth1/11]
    class_name: l1PhysIf
    attributes:
      - name: layer
        value: Layer3
  - dn: sys/acl/ipv4/name-[EPBR-ACL1]
    class_name: ipv4aclACL
    attributes:
      - name: name
        value: EPBR-ACL1
    children:
      - rn: seq-10
        class_name: ipv4aclACE
        attributes:
          - name: seqNum
            value: 10
          - name: action
            value: permit
          - name: protocol
            value: ip
          - name: srcPrefix
            value: 10.1.1.0
          - name: srcPrefixLength
            value: 24
          - name: dstPrefix
            value: 0.0.0.0
          - name: dstPrefixLength
            value: 0
  - dn: sys/track/object-10
    class_name: trackObject
    attributes:
      - name: id
        value: 10
    children:
      - rn: if
        class_name: trackIf
        attributes:
          - name: id
            value: lo123
          - name: protocolType
            value: line-protocol
    dependencies: [1]
  - dn: sys/epbr
    class_name: epbrEntity
    no_delete: true
    dependencies: [0]
  - dn: sys/epbr/inst
    class_name: epbrInst
    no_delete: true
    dependencies: [6]
  - dn: sys/epbr/inst/service-[SVC2]
    class_name: epbrService
    no_delete: true
    dependencies: [7]
    attributes:
      - name: name
        value: SVC2
      - name: secGroup
        value: 300
      - name: reverseSecGroup
        value: 400
    children:
      - rn: ep-[10.1.1.20]
        class_name: epbrSvcEndPoint
        attributes:
          - name: ip
            value: 10.1.1.20
  - dn: sys/epbr/inst/service-[SVC3]
    class_name: epbrService
    no_delete: true
    dependencies: [7]
    attributes:
      - name: name
        value: SVC3
    children:
      - rn: probe
        class_name: epbrProbe
        attributes:
          - name: protocol
            value: ICMP
      - rn: ep-[10.1.1.30]
        class_name: epbrSvcEndPoint
        attributes:
          - name: ip
            value: 10.1.1.30
  - dn: sys/epbr/inst/chain-[CHAIN2]
    class_name: epbrServiceChain
    no_delete: true
    dependencies: [8]
    attributes:
      - name: name
        value: CHAIN2
      - name: mode
        value: multisite
    children:
      - rn: seq-10
        class_name: epbrEpbrMatchSeq
        attributes:
          - name: seqno
            value: 10
          - name: name
            value: SVC2
  - dn: sys/intf/phys-[eth1/12]
    class_name: l1PhysIf
    attributes:
      - name: mode
        value: trunk
  - dn: sys/intf/phys-[eth1/13]
    class_name: l1PhysIf
    attributes:
      - name: mode
        value: trunk
  - dn: sys/bd/bd-[vlan-200]
    class_name: l2BD
    attributes:
      - name: fabEncap
        value: vlan-200
  - dn: sys/acl/mac/name-[EPBR-MAC1]
    class_name: macaclACL
    attributes:
      - name: name
        value: EPBR-MAC1
  - dn: sys/acl/mac/name-[EPBR-MAC1]/seq-10
    class_name: macaclSEQ
    dependencies: [14]
    attributes:
      - name: seqNum
        value: 10
    children:
      - rn: ace
        class_name: macaclACE
        attributes:
          - name: action
            value: permit
          - name: srcPrefix
            value: '00:00:00:00:00:00'
          - name: srcPrefixMask
            value: 'FF:FF:FF:FF:FF:FF'
          - name: dstPrefix
            value: '00:00:00:00:00:00'
          - name: dstPrefixMask
            value: 'FF:FF:FF:FF:FF:FF'
additional_tests:
  # layer-2 service with layer-2 endpoints and a layer-2 policy
  - |-
    resource "nxos_epbr" "test" {
      services = {
        "L2SVC" = {
          type            = "l2"
          connection_mode = "half-duplex"
          l2_endpoints = {
            "eth1/12" = {
              probe_protocol            = "CTP"
              probe_frequency           = 10
              probe_retry_down_count    = 2
              probe_retry_up_count      = 2
              probe_timeout             = 3
              reverse_service_interface = "eth1/13"
              reverse_probe_protocol    = "CTP"
              reverse_probe_frequency   = 10
            }
          }
        }
      }
      policies = {
        "L2POL" = {
          default_traffic_action = "redirect-all"
          matches = {
            "EPBR-MAC1" = {
              access_list_type = "l2"
              vlans            = "200"
              sequences = {
                "10" = {
                  service = "L2SVC"
                }
              }
            }
          }
        }
      }
    }
