---
name: SLA
class_name: slaEntity
dn: sys/sla
ds_description: This data source can read the IP SLA configuration on NX-OS devices, including sender probes (ICMP echo, UDP echo, UDP jitter, TCP connect, DNS and HTTP operations), reactions, schedules, group schedules, responder, TWAMP responder and TWAMP server settings.
res_description: This resource can manage the IP SLA configuration on NX-OS devices, including sender probes (ICMP echo, UDP echo, UDP jitter, TCP connect, DNS and HTTP operations), reactions, schedules, group schedules, responder, TWAMP responder and TWAMP server settings.
doc_path: Communication/sla:Entity/
doc_category: Monitoring
child_classes:
  - class_name: slaInst
    doc_path: Communication/sla:Inst/
    rn: inst
    type: single
    tf_name: instance
    description: 'IP SLA instance.'
    child_classes:
      - class_name: slaSender
        doc_path: Communication/sla:Sender/
        rn: sender
        type: single
        tf_name: sender
        description: 'IP SLA sender configuration.'
        attributes:
          - nxos_name: loggingLevel
            tf_name: sender_logging_level
            type: Int64
            write_only: true
            min_int: 0
            max_int: 7
            description: 'configures the logging level for ip sla sender. The property can be set only if feature sla sender is enabled.'
            example: 5
          - nxos_name: loggingTraps
            tf_name: sender_logging_traps
            type: Bool
            description: 'Enable syslog traps which sends the trap meesages on reaction-config trap is enabled.'
            example: true
          - nxos_name: resetSender
            tf_name: sender_reset
            type: Bool
            description: 'Resets all sla probe related configuration.'
            example: true
            exclude_test: true
        child_classes:
          - class_name: slaProbe
            doc_path: Communication/sla:Probe/
            rn: operation-%v
            type: list
            tf_name: probes
            description: 'List of IP SLA probes (operations).'
            attributes:
              - nxos_name: id
                tf_name: id
                type: Int64
                id: true
                min_int: 1
                max_int: 2147483647
                description: 'Operation index which is unique for each probe, all the probe related configs and the statistics are displayed using this index.'
                example: 1
              - nxos_name: restart
                tf_name: restart
                type: Bool
                description: 'Restarting a scheduled probe.'
                example: true
                exclude_test: true
            child_classes:
              - class_name: slaIcmpEcho
                doc_path: Communication/sla:IcmpEcho/
                rn: icmpecho
                type: single
                tf_name: icmp_echo
                description: 'ICMP echo probe configuration.'
                attributes:
                  - nxos_name: bucketsKept
                    tf_name: icmp_echo_buckets_kept
                    type: Int64
                    min_int: 1
                    max_int: 60
                    description: 'Bucket size value - Maximum number of history buckets to collect.'
                    example: 30
                  - nxos_name: destHostName
                    tf_name: icmp_echo_destination_hostname
                    type: String
                    description: 'Destination Host Name, if IP address is resolved from DNS server.Modifying this property is not allowed in case of icmp-echo probe.'
                    example: host1.example.com
                    exclude_test: true
                  - nxos_name: destip
                    tf_name: icmp_echo_destination_ip
                    type: String
                    description: 'Destination IP address which is tracked by the probe.This property is not applicable if the configured probe type is HTTP or DNS. Modifying this property is not allowed in case of icmp-echo probe.'
                    example: '10.1.1.1'
                  - nxos_name: distributionsOfStatsKept
                    tf_name: icmp_echo_distributions_of_statistics_kept
                    type: Int64
                    min_int: 1
                    max_int: 20
                    description: 'Maximum number of statistics distribution buckets to capture.'
                    example: 5
                  - nxos_name: enhancedBuckets
                    tf_name: icmp_echo_enhanced_buckets
                    type: Int64
                    min_int: 0
                    max_int: 100
                    description: 'Number of buckets to collect data based on the enhanced interval.'
                    example: 50
                  - nxos_name: enhancedInterval
                    tf_name: icmp_echo_enhanced_interval
                    type: Int64
                    min_int: 0
                    max_int: 3600
                    description: 'Aggregation interval in seconds to collect the aggregated values.'
                    example: 900
                  - nxos_name: filter
                    tf_name: icmp_echo_filter
                    type: String
                    description: 'Bucket size value - Maximum number of history buckets to collect.'
                    enum_values:
                      - 'None'
                      - All
                      - OverThreshold
                      - Failures
                    example: All
                  - nxos_name: frequency
                    tf_name: icmp_echo_frequency
                    type: Int64
                    min_int: 1
                    max_int: 604800
                    description: 'Frequency of an operation - The interval at which the configured destination is tracked by the probe. Frequency in seconds(default value is 60). Minimum frequency value for an IP SLAs HTTP probe operation is 60 seconds but 1 second for other probes.'
                    example: 30
                  - nxos_name: frequencyInMilliseconds
                    tf_name: icmp_echo_frequency_milliseconds
                    type: Int64
                    min_int: 100
                    max_int: 604800000
                    description: 'Frequency of an operation - The interval at which the configured destination is tracked by the probe. Frequency in milliseconds(default value is 60000).'
                    example: 30000
                    exclude_test: true
                  - nxos_name: hoursOfStatsKept
                    tf_name: icmp_echo_hours_of_statistics_kept
                    type: Int64
                    min_int: 0
                    max_int: 25
                    description: 'Maximum number of statistics hour groups to capture.'
                    example: 5
                  - nxos_name: ipTos
                    tf_name: icmp_echo_tos
                    type: Int64
                    min_int: 0
                    max_int: 4294967295
                    description: 'TOS if the probe is tracking IPv4 destination and Traffic Class if the probe is tracking IPv6 destination.'
                    example: 10
                  - nxos_name: ipv6TrafficClass
                    tf_name: icmp_echo_ipv6_traffic_class
                    type: Int64
                    min_int: 0
                    max_int: 4294967295
                    description: 'TOS if the probe is tracking IPv4 destination and Traffic Class if the probe is tracking IPv6 destination.'
                    example: 10
                    exclude_test: true
                  - nxos_name: livesKept
                    tf_name: icmp_echo_lives_kept
                    type: Int64
                    min_int: 0
                    max_int: 2
                    description: 'Maximum number of history lives to collect.'
                    example: 1
                  - nxos_name: owner
                    tf_name: icmp_echo_owner
                    type: String
                    description: 'Owner string of the probe(Max size 127).'
                    example: OWNER1
                  - nxos_name: reqDataSize
                    tf_name: icmp_echo_request_data_size
                    type: Int64
                    min_int: 16
                    max_int: 17512
                    description: 'Sets the protocol data size in the payload of an IP SLAs operation''s request packet.'
                    example: 100
                  - nxos_name: srcHostName
                    tf_name: icmp_echo_source_hostname
                    type: String
                    description: 'Source Host Name, if IP address is resolved from DNS server. Modifying this property is not allowed.'
                    example: host2.example.com
                    exclude_test: true
                  - nxos_name: srcInterface
                    tf_name: icmp_echo_source_interface
                    type: String
                    description: 'Source Interface in which the ingress icmp packet is received.'
                    example: eth1/10
                  - nxos_name: srcip
                    tf_name: icmp_echo_source_ip
                    type: String
                    description: 'Source`IP address from which the configured destination is tracked by the probe. Modifying this property is not allowed.'
                    example: '10.0.0.1'
                    exclude_test: true
                  - nxos_name: statsDistributionInterval
                    tf_name: icmp_echo_statistics_distribution_interval
                    type: Int64
                    min_int: 1
                    max_int: 100000
                    description: 'Statistics distribution interval size, if the precision configured is in milliseconds, then the unit is in milliseconds else if it is microseconds, then the unit is in microseconds.'
                    example: 10
                  - nxos_name: tag
                    tf_name: icmp_echo_tag
                    type: String
                    description: 'User defined tag string (Max Size 127).'
                    example: TAG1
                  - nxos_name: threshold
                    tf_name: icmp_echo_threshold
                    type: Int64
                    min_int: 1
                    max_int: 60000
                    description: 'Operation threshold - this is an upper limit for the observed RTT for the probe. RTT value of a probe exceeding the configured threshold will be marked with Overthreshold return code.'
                    example: 1000
                  - nxos_name: timeout
                    tf_name: icmp_echo_timeout
                    type: Int64
                    min_int: 1
                    max_int: 604800000
                    description: 'Timeout of an operation - this is the maximum wait time for completing the operation. The probe will be marked with Timeout return code.'
                    example: 2000
                  - nxos_name: verifyData
                    tf_name: icmp_echo_verify_data
                    type: Bool
                    description: 'Verify Data for Corruption. When data verification is enabled, each operation response is checked for corruption. Use the verify-data command with caution during normal operations because it generates unnecessary overhead.'
                    example: true
                  - nxos_name: vrf
                    tf_name: icmp_echo_vrf
                    type: String
                    description: 'vrf on which the probe is configured.'
                    example: management
              - class_name: slaUdpEcho
                doc_path: Communication/sla:UdpEcho/
