---
name: Telemetry
class_name: telemetryEntity
dn: sys/tm
no_delete: true
ds_description: This data source can read the streaming telemetry configuration on NX-OS devices, including destination groups, sensor groups, subscriptions, and their relationships.
res_description: This resource can manage the streaming telemetry configuration on NX-OS devices, including destination groups, sensor groups, subscriptions, and their relationships.
doc_path: Streaming%20Telemetry/telemetry:Entity/
doc_category: Monitoring
attributes:
  - nxos_name: adminSt
    tf_name: admin_state
    type: String
    description: 'The administrative state of the object or policy.'
    enum_values:
      - enabled
    example: enabled
  - nxos_name: batchDmeEvt
    tf_name: batch_dme_events
    type: Bool
    description: 'DME events batching is enabled or disabled.'
    example: false
  - nxos_name: mergeSubs
    tf_name: merge_subscriptions
    type: Bool
    description: 'Subscriptions merging enabled or disabled.'
    example: true
child_classes:
  - class_name: telemetryCertificate
    rn: certificate
    type: single
    tf_name: certificate
    description: 'Global telemetry certificate.'
    exclude_test: true
    doc_path: Streaming%20Telemetry/telemetry:Certificate/
    attributes:
      - nxos_name: filename
        tf_name: certificate_filename
        type: String
        description: 'Name of the .pem certificate file.'
        example: '/bootflash/telemetry.pem'
      - nxos_name: hostname
        tf_name: certificate_hostname
        type: String
        description: 'Hostname associated with the certificate.'
        example: 'collector.example.com'
      - nxos_name: trustpoint
        tf_name: certificate_trustpoint
        type: String
        description: 'Name of the certificate trustpoint.'
        example: 'TP1'
  - class_name: telemetryDestProfile
    rn: destprof
    type: single
    tf_name: destination_profile
    description: 'Default Destination Profile.'
    doc_path: Streaming%20Telemetry/telemetry:DestProfile/
    attributes:
      - nxos_name: adminSt
        tf_name: destination_profile_admin_state
        type: String
        description: 'Admin state.'
        enum_values:
          - enabled
        example: enabled
    child_classes:
      - class_name: telemetryDestOptVrf
        rn: vrf
        type: single
        tf_name: use_vrf
        description: 'Destination option for vrf.'
        doc_path: Streaming%20Telemetry/telemetry:DestOptVrf/
        attributes:
          - nxos_name: name
            tf_name: destination_profile_vrf
            type: String
            description: 'VRF name.'
            example: management
      - class_name: telemetryDestOptCompression
        rn: compression
        type: single
        tf_name: compression
        description: 'Destination option for compression.'
        doc_path: Streaming%20Telemetry/telemetry:DestOptCompression/
        attributes:
          - nxos_name: name
            tf_name: destination_profile_compression
            type: String
            description: 'Compression name.'
            enum_values:
              - disabled
              - gzip
            example: gzip
      - class_name: telemetryDestOptGrpcDeadline
        rn: deadline
        type: single
        tf_name: grpc_deadline
        description: 'Destination option for gRPC deadline.'
        doc_path: Streaming%20Telemetry/telemetry:DestOptGrpcDeadline/
        attributes:
          - nxos_name: timeout
            tf_name: destination_profile_grpc_deadline
            type: Int64
            min_int: 30
            max_int: 120
            description: 'Deadline timeout value (in secondes).'
            example: 60
      - class_name: telemetryDestOptNodeId
        rn: nodeid
        type: single
        tf_name: node_id
        description: 'Destination option for node ID.'
        doc_path: Streaming%20Telemetry/telemetry:DestOptNodeId/
        attributes:
          - nxos_name: name
            tf_name: destination_profile_node_id
            type: String
            description: 'NodeID name.'
            example: 'leaf1'
      - class_name: telemetryDestOptRetry
        rn: retry
        type: single
        tf_name: retry
        description: 'Destination option for retry.'
        doc_path: Streaming%20Telemetry/telemetry:DestOptRetry/
        attributes:
          - nxos_name: size
            tf_name: destination_profile_retry_size
            type: Int64
            min_int: 10
            max_int: 1500
            description: 'Send retry buffer size (in MB).'
            example: 100
      - class_name: telemetryDestOptSourceInterface
        rn: sourceinterface
        type: single
        tf_name: source_interface
        description: 'Destination option for source interface.'
        doc_path: Streaming%20Telemetry/telemetry:DestOptSourceInterface/
        attributes:
          - nxos_name: name
            tf_name: destination_profile_source_interface
            type: String
            description: 'Source interface name.'
            example: 'mgmt0'
            exclude_test: true
  - class_name: telemetryDestGroup
    rn: dest-[%s]
    type: list
    tf_name: destination_groups
    description: 'Destination Group.'
    doc_path: Streaming%20Telemetry/telemetry:DestGroup/
    attributes:
      - nxos_name: id
        tf_name: id
        type: String
        id: true
        description: 'Destination group ID.'
        example: '1'
    child_classes:
      - class_name: telemetryDestGrpOptCertificate
        rn: certificate
        type: single
        tf_name: certificate
        description: 'Destination group option for certificate.'
        exclude_test: true
        doc_path: Streaming%20Telemetry/telemetry:DestGrpOptCertificate/
        attributes:
          - nxos_name: filename
            tf_name: certificate_filename
            type: String
            description: 'Name of the .pem certificate file.'
            example: '/bootflash/collector.pem'
          - nxos_name: hostname
            tf_name: certificate_hostname
            type: String
            description: 'Hostname associated with the certificate.'
            example: 'collector.example.com'
      - class_name: telemetryDestGrpOptChunking
        rn: chunking
        type: single
        tf_name: chunking
        description: 'Destination group option for chunking.'
        doc_path: Streaming%20Telemetry/telemetry:DestGrpOptChunking/
        attributes:
          - nxos_name: chunkSize
            tf_name: chunking_size
            type: Int64
            min_int: 64
            max_int: 4096
            description: 'Chunking size in kbytes.'
            example: 128
      - class_name: telemetryDestGrpOptCompression
        rn: compression
        type: single
        tf_name: compression
        description: 'Destination group option for compression.'
        doc_path: Streaming%20Telemetry/telemetry:DestGrpOptCompression/
        attributes:
          - nxos_name: name
            tf_name: compression
            type: String
            description: 'Destination-group Compression name.'
            enum_values:
              - disabled
              - gzip
            example: gzip
      - class_name: telemetryDestGrpOptMaxMessage
        rn: message
        type: single
        tf_name: max_message
        description: 'Destination group option for maximum message size.'
        doc_path: Streaming%20Telemetry/telemetry:DestGrpOptMaxMessage/
        attributes:
          - nxos_name: messageSize
            tf_name: max_message_size
            type: Int64
            min_int: 12288
            max_int: 32768
            description: 'Message size in kbytes.'
            example: 16384
      - class_name: telemetryDestGrpOptSourceInterface
        rn: sourceinterface
        type: single
        tf_name: source_interface
        description: 'Destination group option for source interface.'
        doc_path: Streaming%20Telemetry/telemetry:DestGrpOptSourceInterface/
        attributes:
          - nxos_name: name
            tf_name: source_interface
            type: String
            description: 'Destination-group source interface.'
            example: 'lo0'
      - class_name: telemetryDestGrpOptVrf
        rn: vrf
        type: single
        tf_name: vrf
        description: 'Destination group option for VRF.'
        doc_path: Streaming%20Telemetry/telemetry:DestGrpOptVrf/
        attributes:
          - nxos_name: name
            tf_name: vrf
            type: String
            description: 'Destination-group VRF name.'
            example: default
      - class_name: telemetryDest
        rn: addr-[%s]-port-[%d]
        type: list
        tf_name: destinations
        description: 'Destination.'
        doc_path: Streaming%20Telemetry/telemetry:Dest/
        attributes:
          - nxos_name: addr
            tf_name: address
            type: String
            id: true
            description: 'Destination IP address.'
            example: '192.168.1.1'
          - nxos_name: enc
            tf_name: encoding
            type: String
            description: 'Destination encoding type.'
            enum_values:
              - GPB
              - JSON
              - GPB-compact
              - Form-data
            example: GPB
          - nxos_name: nodeid
            tf_name: node_id
            type: String
            description: 'Destination node Identifier.'
            example: 'host1'
          - nxos_name: port
            tf_name: port
            type: Int64
            id: true
            min_int: 0
            max_int: 65535
            description: 'Destination port number.'
            example: 50001
          - nxos_name: proto
            tf_name: protocol
            type: String
            description: 'Destination protocol type.'
            enum_values:
              - UDP
              - gRPC
              - HTTP
            example: gRPC
  - class_name: telemetrySensorGroup
    rn: sensor-[%s]
    type: list
    tf_name: sensor_groups
    description: 'Sensor Group.'
    doc_path: Streaming%20Telemetry/telemetry:SensorGroup/
    attributes:
      - nxos_name: dataSrc
        tf_name: data_source
        type: String
        description: 'Data source for this sensor group.'
        enum_values:
          - DME
          - NX-API
          - YANG
          - NATIVE
          - DEFAULT
        example: DME
      - nxos_name: id
        tf_name: id
        type: String
        id: true
        description: 'Sensor group identifier.'
        example: '1'
    child_classes:
      - class_name: telemetrySensorPath
        rn: path-[%s]
        type: list
        tf_name: sensor_paths
        description: 'The DME/Open-Config/Device-Yang/Usability path.'
        doc_path: Streaming%20Telemetry/telemetry:SensorPath/
        attributes:
          - nxos_name: alias
            tf_name: alias
            type: String
            description: 'The alias of the en-coding path.'
            example: 'mypath'
          - nxos_name: depth
            tf_name: depth
            type: Int64
            min_int: 0
            max_int: 4294967295
            description: 'The number of levels of managed objects retrieved (For path property value == Usability path only level 0 is valid value).'
            example: 1
          - nxos_name: filterCondition
            tf_name: filter_condition
            type: String
            description: 'The condition(s) for filtering the queried notifications.'
            example: 'gt(operBitrate,0)'
          - nxos_name: path
            tf_name: path
            type: String
            id: true
            description: 'The path to the monitored data.'
            example: 'sys/intf'
          - nxos_name: queryCondition
            tf_name: query_condition
            type: String
            description: 'The condition(s) for retrieving notifications.'
            example: 'query-condition-example'
  - class_name: telemetrySubscription
    rn: subs-[%d]
    type: list
    tf_name: subscriptions
    description: 'Subscription.'
    doc_path: Streaming%20Telemetry/telemetry:Subscription/
    attributes:
      - nxos_name: id
        tf_name: id
        type: Int64
        id: true
        min_int: 1
        max_int: 4095
        description: 'Subscription identifier.'
        example: 1
    child_classes:
      - class_name: telemetryRsSensorGroupRel
        rn: rtsensorGroupRel-[%s]
        type: list
        tf_name: sensor_group_relationships
        description: 'Link to sensorGroup entry.'
        doc_path: Streaming%20Telemetry/telemetry:RsSensorGroupRel/
        attributes:
          - nxos_name: tDn
            tf_name: target_dn
            type: String
            id: true
            description: 'Target distinguished name of the sensor group.'
            example: 'sys/tm/sensor-1'
          - nxos_name: sampleIntvl
            tf_name: sample_interval
            type: Int64
            min_int: 0
            max_int: 604800000
            description: 'Sensor sample inteval.'
            example: 5000
      - class_name: telemetryRsDestGroupRel
        rn: rtdestGroupRel-[%s]
        type: list
        tf_name: destination_group_relationships
        description: 'Link to destGroup entry.'
        doc_path: Streaming%20Telemetry/telemetry:RsDestGroupRel/
        attributes:
          - nxos_name: tDn
            tf_name: target_dn
            type: String
            id: true
            description: 'Target distinguished name of the destination group.'
            example: 'sys/tm/dest-1'
test_prerequisites:
  - dn: sys/fm/telemetry
    class_name: fmTelemetry
    no_delete: true
    attributes:
      - name: adminSt
        value: enabled
