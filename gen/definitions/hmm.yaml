---
name: HMM
class_name: hmmEntity
dn: sys/hmm
ds_description: This data source can read the Host Mobility Manager (HMM) configuration on NX-OS devices, including anycast gateway MAC, duplicate host detection and fabric forwarding interface settings.
res_description: This resource can manage the Host Mobility Manager (HMM) configuration on NX-OS devices, including anycast gateway MAC, duplicate host detection and fabric forwarding interface settings.
doc_path: Host%20Mobility/hmm:Entity/
doc_category: Overlay
attributes:
  - nxos_name: adminSt
    tf_name: admin_state
    type: String
    description: "The administrative state of the object or policy."
    enum_values:
      - enabled
      - disabled
    example: enabled
child_classes:
  - class_name: hmmFwdInst
    rn: fwdinst
    type: single
    doc_path: Host%20Mobility/hmm:FwdInst/
    attributes:
      - nxos_name: adminSt
        tf_name: instance_admin_state
        type: String
        description: "The administrative state of the object or policy."
        enum_values:
          - enabled
          - disabled
        example: enabled
      - nxos_name: amac
        tf_name: anycast_mac
        type: String
        description: "Anycast Gateway MAC address."
        example: "20:20:00:00:10:10"
      - nxos_name: adminDist
        tf_name: administrative_distance
        type: Int64
        min_int: 1
        max_int: 255
        description: "Set the administrative distance for HMM."
        example: 150
      - nxos_name: ctrl
        tf_name: control
        type: String
        description: "The control state."
        allow_non_enum_values: true
        enum_values:
          - stateful-ha
        example: stateful-ha
      - nxos_name: limitVlanMac
        tf_name: limit_vlan_mac
        type: Int64
        min_int: 5
        max_int: 4096
        description: "This is to limit the number of hosts learnt by HMM in the same subnet with same MAC information."
        example: 100
      - nxos_name: selHostProbe
        tf_name: selective_host_probe
        type: String
        description: "When set to True, host mobility will be triggered when a remote host route exists irrespective of the sequence id."
        enum_values:
          - "no"
          - "yes"
        example: "yes"
        exclude_test: true
    child_classes:
      - class_name: hmmFwdEvpn
        rn: evpn
        type: single
        tf_name: evpn
        description: 'HMM Fabric Forwarding EVPN instance, including duplicate host detection and recovery settings.'
        doc_path: Host%20Mobility/hmm:FwdEvpn/
        attributes:
          - nxos_name: adminSt
            tf_name: evpn_admin_state
            type: String
            description: "The administrative state of the object or policy."
            enum_values:
              - enabled
              - disabled
            example: enabled
          - nxos_name: ctrl
            tf_name: evpn_control
            type: String
            description: "The control state."
            allow_non_enum_values: true
            enum_values:
              - stateful-ha
            example: stateful-ha
          - nxos_name: ddHmmoves
            tf_name: duplicate_host_detection_moves
            type: Int64
            min_int: 1
            max_int: 1000
            description: "User Setting to mark a host as duplicate if it does ddHmmoves number of moves."
            example: 10
          - nxos_name: ddHnsecs
            tf_name: duplicate_host_detection_seconds
            type: Int64
            min_int: 2
            max_int: 36000
            description: "User Setting to mark a host as duplicate if it does ddHmmoves moves in ddHnsecs seconds."
            example: 300
          - nxos_name: dhrcount
            tf_name: duplicate_host_recovery_count
            type: Int64
            min_int: 1
            max_int: 3000
            description: "Number of times (dhrcount) to periodically check if a Duplicate marked Host is no longer duplicate."
            example: 10
          - nxos_name: dhrtimeout
            tf_name: duplicate_host_recovery_timeout
            type: Int64
            min_int: 30
            max_int: 36000
            description: "User Setting to periodically (dhrtimeout seconds) check if a Duplicate marked Host is no longer duplicate."
            example: 60
      - class_name: hmmFwdIf
        rn: if-[%s]
        type: list
        tf_name: interfaces
        description: 'List of HMM Fabric Forwarding interfaces.'
        doc_path: Host%20Mobility/hmm:FwdIf/
        attributes:
          - nxos_name: id
            tf_name: interface_id
            type: String
            id: true
            description: "Must match first field in the output of `show intf brief`. Example: `vlan10`."
            example: vlan10
          - nxos_name: adminSt
            tf_name: admin_state
            type: String
            description: "The administrative state of the object or policy."
            enum_values:
              - enabled
              - disabled
            example: enabled
          - nxos_name: mode
            tf_name: mode
            type: String
            description: "HMM Fabric Forwarding mode information for the interface."
            enum_values:
              - standard
              - anycastGW
              - proxyGW
            example: anycastGW
          - nxos_name: proxy
            tf_name: proxy
            type: Bool
            description: "Enable Anycast Gateway with proxy."
            min_version: '10.6(3)'
            example: true
            exclude_test: true
          - nxos_name: descr
            tf_name: description
            type: String
            description: "Description."
            example: "My Description"
test_prerequisites:
  - dn: sys/fm/ifvlan
    class_name: fmInterfaceVlan
    no_delete: true
    attributes:
      - name: adminSt
        value: enabled
  - dn: sys/intf/svi-[vlan10]
    class_name: sviIf
    attributes:
      - name: id
        value: vlan10
    dependencies: [0]
  - dn: sys/fm/hmm
    class_name: fmHmm
    attributes:
      - name: adminSt
        value: enabled
  - dn: sys/fm/evpn
    class_name: fmEvpn
    no_delete: true
    attributes:
      - name: adminSt
        value: enabled
