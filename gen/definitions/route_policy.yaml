    type: single
    tf_name: instance
    description: 'Route Policy Instance.'
    child_classes:
      - class_name: rpmRpmIf
        doc_path: Routing%20and%20Forwarding/rpm:RpmIf/
        rn: rpmif-[%s]
        type: list
        tf_name: ipv4_policy_interfaces
        description: 'List of interfaces with an IPv4 policy based routing route map.'
        attributes:
          - nxos_name: id
            tf_name: interface_id
            type: String
            id: true
            description: 'Interface id over which the pbr policy is configured. Must match first field in the output of `show intf brief`. Example: `eth1/1` or `vlan100`.'
            example: vlan10
          - nxos_name: rmapname
            tf_name: route_map_name
            type: String
            description: 'IP Route map Policy Name.'
            example: PBR_ROUTE_MAP_V4
      - class_name: rpmRpmv6If
        doc_path: Routing%20and%20Forwarding/rpm:Rpmv6If/
        rn: rpmv6if-[%s]
        type: list
        tf_name: ipv6_policy_interfaces
        description: 'List of interfaces with an IPv6 policy based routing route map.'
        attributes:
          - nxos_name: id
            tf_name: interface_id
            type: String
            id: true
            description: 'Interface id over which the pbr policy is configured. Must match first field in the output of `show intf brief`. Example: `eth1/1` or `vlan100`.'
            example: vlan10
          - nxos_name: rmapname
            tf_name: route_map_name
            type: String
            description: 'IP Route map Policy Name.'
            example: PBR_ROUTE_MAP_V6
test_prerequisites:
  - dn: sys/fm/pbr
    class_name: fmPbr
    no_delete: true
    attributes:
      - name: adminSt
        value: enabled
  - dn: sys/fm/ifvlan
    class_name: fmInterfaceVlan
    no_delete: true
    attributes:
      - name: adminSt
        value: enabled
  - dn: sys/intf/svi-[vlan10]
    class_name: sviIf
    dependencies: [1]
    attributes:
      - name: id
        value: vlan10
  - dn: sys/track/object-10
    class_name: trackObject
    attributes:
      - name: id
        value: 10
    children:
      - rn: if
        class_name: trackIf
        attributes:
          - name: id
            value: vlan10
          - name: protocolType
            value: line-protocol
    dependencies: [2]
additional_tests:
  # policy based routing route maps applied to an interface
  - |-
    resource "nxos_route_policy" "test" {
      route_maps = {
        "PBR_ROUTE_MAP_V4" = {
          entries = {
            10 = {
              action                 = "permit"
              set_vrf_v4             = "enabled"
              verify_availability_v4 = "enabled"
              match_route_access_lists = {
                "sys/rpm/accesslist-[ACL1]" = {}
              }
              set_next_hops = {
                "1.2.3.4" = {
                  track_id = 10
                  vrf      = "VRF1"
                }
                "1.2.3.5" = {
                  vrf = "VRF1"
                }
              }
            }
            20 = {
              action = "permit"
              set_interfaces = {
                "null0" = {}
              }
            }
          }
        }
        "PBR_ROUTE_MAP_V6" = {
          entries = {
            10 = {
              action = "permit"
              match_route_ipv6_access_lists = {
                "sys/rpm/accesslist-[ACL1]" = {}
              }
              set_next_hops = {
                "2001:db8::1" = {}
              }
            }
          }
        }
      }
      ipv4_policy_interfaces = {
        "vlan10" = {
          route_map_name = "PBR_ROUTE_MAP_V4"
        }
      }
      ipv6_policy_interfaces = {
        "vlan10" = {
          route_map_name = "PBR_ROUTE_MAP_V6"
        }
      }
      depends_on = [nxos_dme.PreReq0, nxos_dme.PreReq1, nxos_dme.PreReq2, nxos_dme.PreReq3]
    }
