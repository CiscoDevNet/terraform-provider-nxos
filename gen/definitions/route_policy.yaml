---
name: Route Policy
class_name: rpmEntity
dn: sys/rpm
ds_description: This data source can read the route policy configuration on NX-OS devices, including IPv4 and IPv6 prefix lists and route maps with match and set criteria.
res_description: This resource can manage the route policy configuration on NX-OS devices, including IPv4 and IPv6 prefix lists and route maps with match and set criteria.
doc_path: Routing%20and%20Forwarding/rpm:Entity/
doc_category: Routing
attributes:
  - nxos_name: adminSt
    tf_name: admin_state
    type: String
    description: 'The administrative state of the object or policy.'
    enum_values:
      - enabled
      - disabled
    example: enabled
    exclude_test: true
child_classes:
  - class_name: rtpfxRuleV4
    doc_path: Routing%20and%20Forwarding/rtpfx:RuleV4/
    rn: pfxlistv4-[%s]
    type: list
    tf_name: ipv4_prefix_lists
    description: 'List of IPv4 Prefix Lists.'
    attributes:
      - nxos_name: name
        tf_name: name
        type: String
        id: true
        description: 'Object name.'
        example: 'PREFIX_LIST1'
      - nxos_name: descr
        tf_name: description
        type: String
        description: 'Description.'
        example: 'My prefix list'
      - nxos_name: mode
        tf_name: mode
        type: String
        description: 'Mode of ipv4 prefix-list.'
        enum_values:
          - IPV4
        example: IPV4
    child_classes:
      - class_name: rtpfxEntry
        doc_path: Routing%20and%20Forwarding/rtpfx:Entry/
        rn: ent-%v
        type: list
        tf_name: entries
        description: 'IPv4 Prefix List entries.'
        attributes:
          - nxos_name: order
            tf_name: order
            type: Int64
            id: true
            description: "Order."
            min_int: 1
            max_int: 4294967294
            example: 10
          - nxos_name: action
            tf_name: action
            type: String
            description: "Action."
            enum_values:
              - deny
              - permit
            example: permit
          - nxos_name: criteria
            tf_name: criteria
            type: String
            description: "Criteria."
            enum_values:
              - exact
              - inexact
            example: inexact
          - nxos_name: pfx
            tf_name: prefix
            type: String
            description: "Specifies the OSPF route prefix."
            example: 192.168.1.0/24
          - nxos_name: fromPfxLen
            tf_name: from_range
            type: Int64
            description: "The start of a range used to describe the prefix length if the criteria is not an exact match."
            min_int: 0
            max_int: 128
            example: 26
          - nxos_name: toPfxLen
            tf_name: to_range
            type: Int64
            description: "The end of a range to describe the prefix length if the criteria is not an exact match."
            min_int: 0
            max_int: 128
            example: 32
          - nxos_name: mask
            tf_name: mask
            type: String
            description: "Mask."
            example: 255.255.255.0
  - class_name: rtpfxRuleV6
    doc_path: Routing%20and%20Forwarding/rtpfx:RuleV6/
    rn: pfxlistv6-[%s]
    type: list
    tf_name: ipv6_prefix_lists
    description: 'List of IPv6 Prefix Lists.'
    attributes:
      - nxos_name: name
        tf_name: name
        type: String
        id: true
        description: 'Object name.'
        example: 'PREFIX_LIST_V6_1'
      - nxos_name: descr
        tf_name: description
        type: String
        description: 'descr.'
        example: 'My IPv6 prefix list'
      - nxos_name: mode
        tf_name: mode
        type: String
        description: 'Mode of ipv6 prefix-list.'
        enum_values:
          - IPV6
        example: IPV6
    child_classes:
      - class_name: rtpfxEntry
        doc_path: Routing%20and%20Forwarding/rtpfx:Entry/
        rn: ent-%v
        type: list
        tf_name: entries
        description: 'IPv6 Prefix List entries.'
        attributes:
          - nxos_name: order
            tf_name: order
            type: Int64
            id: true
            description: "Order."
            min_int: 1
            max_int: 4294967294
            example: 10
          - nxos_name: action
            tf_name: action
            type: String
            description: "Action."
            enum_values:
              - deny
              - permit
            example: permit
          - nxos_name: criteria
            tf_name: criteria
            type: String
            description: "Criteria."
            enum_values:
              - exact
              - inexact
            example: inexact
          - nxos_name: pfx
            tf_name: prefix
            type: String
            description: "Specifies the OSPF route prefix."
            example: '2001:db8::/32'
          - nxos_name: fromPfxLen
            tf_name: from_range
            type: Int64
            description: "The start of a range used to describe the prefix length if the criteria is not an exact match."
            min_int: 0
            max_int: 128
            example: 48
          - nxos_name: toPfxLen
            tf_name: to_range
            type: Int64
            description: "The end of a range to describe the prefix length if the criteria is not an exact match."
            min_int: 0
            max_int: 128
            example: 64
          - nxos_name: mask
            tf_name: mask
            type: String
            description: "Mask."
            example: 'ffff:ff00::'
  - class_name: rtmapRule
    doc_path: Routing%20and%20Forwarding/rtmap:Rule/
    rn: rtmap-[%s]
    type: list
    tf_name: route_maps
    description: 'List of Route Maps.'
    attributes:
      - nxos_name: name
        tf_name: name
        type: String
        description: 'Object name.'
        id: true
        example: ROUTE_MAP1
      - nxos_name: pbrStatistics
        tf_name: pbr_statistics
        type: String
        description: 'Route map pbr-statistics.'
        enum_values:
          - enabled
          - disabled
        example: enabled
    child_classes:
      - class_name: rtmapEntry
        doc_path: Routing%20and%20Forwarding/rtmap:Entry/
        rn: ent-%v
        type: list
        tf_name: entries
        description: 'List of Route Map Entries.'
        attributes:
          - nxos_name: order
            tf_name: order
            type: Int64
            description: 'Order.'
            min_int: 0
            max_int: 65535
            example: 10
            id: true
          - nxos_name: action
            tf_name: action
            type: String
            description: 'Action.'
            enum_values:
              - deny
              - permit
            example: permit
          - nxos_name: descr
            tf_name: description
            type: String
            description: 'Description.'
            example: 'My route map entry'
          - nxos_name: dropOnFailV4
            tf_name: drop_on_fail_v4
            type: String
            description: 'Drop On Fail V4 for v4 nexthop.'
            enum_values:
              - enabled
              - disabled
            example: disabled
          - nxos_name: dropOnFailV6
            tf_name: drop_on_fail_v6
            type: String
            description: 'Drop On Fail V6 for v6 nexthop.'
            enum_values:
              - enabled
              - disabled
            example: disabled
          - nxos_name: forceOrderV4
            tf_name: force_order_v4
            type: String
            description: 'Force Order V4.'
            enum_values:
              - enabled
              - disabled
            example: disabled
          - nxos_name: forceOrderV6
            tf_name: force_order_v6
            type: String
            description: 'Force Order V6.'
            enum_values:
              - enabled
              - disabled
            example: disabled
          - nxos_name: loadShareV4
            tf_name: load_share_v4
            type: String
            description: 'Load Sharing V4.'
            enum_values:
              - enabled
              - disabled
            example: disabled
          - nxos_name: loadShareV6
            tf_name: load_share_v6
            type: String
            description: 'Load Sharing V6.'
            enum_values:
              - enabled
              - disabled
            example: disabled
          - nxos_name: setDefaultNhV4
            tf_name: set_default_next_hop_v4
            type: String
            description: 'Default V4 Next-hop Address.'
            enum_values:
              - enabled
              - disabled
            example: disabled
          - nxos_name: setDefaultNhV6
            tf_name: set_default_next_hop_v6
            type: String
            description: 'Default V6 Next-hop Address.'
            enum_values:
              - enabled
              - disabled
            example: disabled
          - nxos_name: setVrfV4
            tf_name: set_vrf_v4
            type: String
            description: 'Enable vrf based set ipv4 next-hop resolution.'
            enum_values:
              - enabled
              - disabled
            example: disabled
          - nxos_name: setVrfV6
            tf_name: set_vrf_v6
            type: String
            description: 'Enable vrf based set ipv6 next-hop resolution.'
            enum_values:
              - enabled
              - disabled
            example: disabled
          - nxos_name: verifyAvailabilityV4
            tf_name: verify_availability_v4
            type: String
            description: 'Next Hop with V4 Verify Availability.'
            enum_values:
              - enabled
              - disabled
            example: disabled
          - nxos_name: verifyAvailabilityV6
            tf_name: verify_availability_v6
            type: String
            description: 'Next Hop with V6 Verify Availability.'
            enum_values:
              - enabled
              - disabled
            example: disabled
        child_classes:
          - class_name: rtmapSetPolicyTag
            doc_path: Routing%20and%20Forwarding/rtmap:SetPolicyTag/
            rn: spctag
            type: single
            tf_name: set_policy_tag
            description: 'Set Policy Tag.'
            attributes:
              - nxos_name: policyTag
                tf_name: set_policy_tag
                type: Int64
                write_only: true
                description: 'Policy Classifier Tag.'
                min_int: 0
                max_int: 65535
                example: 100
          - class_name: rtmapMatchRtDst
            doc_path: Routing%20and%20Forwarding/rtmap:MatchRtDst/
            rn: mrtdst
            type: single
            tf_name: match_route
            description: 'Match Route configuration.'
            child_classes:
              - class_name: rtmapRsRtDstAtt
                doc_path: Routing%20and%20Forwarding/rtmap:RsRtDstAtt/
                rn: rsrtDstAtt-[%s]
                type: list
                tf_name: match_route_prefix_lists
                description: 'List of Match Route Prefix Lists.'
                attributes:
                  - nxos_name: tDn
                    tf_name: prefix_list_dn
                    type: String
                    description: "DN of Prefix List. For example: `sys/rpm/pfxlistv4-[PREFIX_LIST1]`"
                    example: sys/rpm/pfxlistv4-[PREFIX_LIST1]
                    id: true
              - class_name: rtmapRsRtDstAccAtt
                doc_path: Routing%20and%20Forwarding/rtmap:RsRtDstAccAtt/
                rn: rtrtDstAccAtt-[%s]
                type: list
                tf_name: match_route_access_lists
                description: 'List of Match Route Access Lists.'
                attributes:
                  - nxos_name: tDn
                    tf_name: access_list_dn
                    type: String
                    description: 'DN of Access List. For example: `sys/acl/ipv4/name-[ACL1]` or `sys/rpm/accesslist-[1.2.3.4/32]`.'
                    example: sys/rpm/accesslist-[1.2.3.4/32]
                    id: true
          - class_name: rtmapSetRegComm
            doc_path: Routing%20and%20Forwarding/rtmap:SetRegComm/
            rn: sregcomm
            type: single
            tf_name: set_regular_community
            description: 'Set Community configuration.'
            attributes:
              - nxos_name: additive
                tf_name: set_regular_community_additive
                type: String
                description: "Add To Existing Community."
                enum_values:
                  - enabled
                  - disabled
                example: disabled
              - nxos_name: noCommAttr
                tf_name: set_regular_community_no_community
                type: String
                description: "No Community Attribute."
                enum_values:
                  - enabled
                  - disabled
                example: disabled
              - nxos_name: setCriteria
                tf_name: set_regular_community_criteria
                type: String
                description: "Criteria."
                enum_values:
                  - none
                  - append
                  - replace
                  - igp
                  - pre-bestpath
                example: none
            child_classes:
              - class_name: rtregcomItem
                doc_path: Routing%20and%20Forwarding/rtregcom:Item/
                rn: item-%s
                type: list
                tf_name: set_regular_community_items
                description: 'List of Set Community Items.'
                attributes:
                  - nxos_name: community
                    tf_name: community
                    type: String
                    description: "Community."
                    example: regular:as2-nn2:65001:123
                    id: true
                  - nxos_name: descr
                    tf_name: description
                    type: String
                    description: "Description of the specified attribute."
                    example: 'My community'
                    exclude_test: true
                  - nxos_name: name
                    tf_name: name
                    type: String
                    description: "Object name."
                    example: 'COMMUNITY1'
                    exclude_test: true
          - class_name: rtmapMatchRtTag
            doc_path: Routing%20and%20Forwarding/rtmap:MatchRtTag/
            rn: mrttag-%v
            type: list
            tf_name: match_tags
            description: 'List of Match Tags.'
            attributes:
              - nxos_name: tag
                tf_name: tag
                type: Int64
                min_int: 0
                max_int: 4294967295
                description: "The color of a policy label."
                id: true
                example: 12345
          - class_name: rtmapSetMetric
            doc_path: Routing%20and%20Forwarding/rtmap:SetMetric/
            rn: smetric
            type: single
            tf_name: set_metric
            description: 'A set rule based on metric.'
            attributes:
              - nxos_name: isBGP
                tf_name: set_metric_is_bgp
                type: Bool
                description: 'is BGP config.'
                example: false
              - nxos_name: metric
                tf_name: set_metric
                type: String
                description: 'Specifies the ISIS interface metric.'
                example: '100'
              - nxos_name: metricD
                tf_name: set_metric_delay
                type: Int64
                description: 'Metric delay.'
                min_int: 0
                max_int: 4294967295
                example: 10
              - nxos_name: metricL
                tf_name: set_metric_load
                type: Int64
                description: 'Metric load.'
                min_int: 0
                max_int: 255
                example: 10
              - nxos_name: metricM
                tf_name: set_metric_mtu
                type: Int64
                description: 'Metric mtu.'
                min_int: 0
                max_int: 16777215
                example: 1500
              - nxos_name: metricR
                tf_name: set_metric_reliability
                type: Int64
                description: 'Metric reliability.'
                min_int: 0
                max_int: 255
                example: 100
          - class_name: rtmapSetMetricType
            doc_path: Routing%20and%20Forwarding/rtmap:SetMetricType/
            rn: smetrict
            type: single
            tf_name: set_metric_type
            description: 'Set Metric Type.'
            attributes:
              - nxos_name: metricT
                tf_name: set_metric_type
                type: String
                description: 'Metric Type.'
                enum_values:
                  - type-1
                  - type-2
                  - internal
                  - external
                example: type-1
          - class_name: rtmapSetNhPeerAddr
            doc_path: Routing%20and%20Forwarding/rtmap:SetNhPeerAddr/
            rn: nhpa
            type: single
            tf_name: set_next_hop
            description: 'Set Nexthop Peer Address configuration.'
            attributes:
              - nxos_name: v4PeerAddr
                tf_name: set_next_hop_v4_peer_address
                type: String
                description: 'Set Next Hop V4 Peer Address.'
                enum_values:
                  - enabled
                  - disabled
                example: disabled
              - nxos_name: v4RedistUnchange
                tf_name: set_next_hop_v4_redist_unchanged
                type: String
                description: 'Set IPv4 Next Hop Redist Unchanged.'
                enum_values:
                  - enabled
                  - disabled
                example: enabled
              - nxos_name: v4Unchange
                tf_name: set_next_hop_v4_unchanged
                type: String
                description: 'Set IPv4 Next Hop Unchanged.'
                enum_values:
                  - enabled
                  - disabled
                example: enabled
              - nxos_name: v6PeerAddr
                tf_name: set_next_hop_v6_peer_address
                type: String
                description: 'Set Next Hop V6 Peer Address.'
                enum_values:
                  - enabled
                  - disabled
                example: disabled
              - nxos_name: v6RedistUnchange
                tf_name: set_next_hop_v6_redist_unchanged
                type: String
                description: 'Set IPv6 Next Hop Redist Unchanged.'
                enum_values:
                  - enabled
                  - disabled
                example: enabled
              - nxos_name: v6Unchange
                tf_name: set_next_hop_v6_unchanged
                type: String
                description: 'Set IPv6 Next Hop Unchanged.'
                enum_values:
                  - enabled
                  - disabled
                example: enabled
          - class_name: rtmapSetPref
            doc_path: Routing%20and%20Forwarding/rtmap:SetPref/
            rn: spref
            type: single
            tf_name: set_local_preference
            description: 'A set rule based on preference.'
            attributes:
              - nxos_name: localPref
                tf_name: set_local_preference
                type: Int64
                description: 'Local Preference.'
                min_int: 0
                max_int: 4294967295
                example: 100
          - class_name: rtmapSetPathSelection
            doc_path: Routing%20and%20Forwarding/rtmap:SetPathSelection/
            rn: spselect
            type: single
            tf_name: set_path_selection
            description: 'Set As Path Tag.'
            attributes:
              - nxos_name: psAdvertise
                tf_name: set_path_selection_advertise
                type: String
                description: 'Specifies BGP path Advertise.'
                enum_values:
                  - unspecified
                  - ps-all
                  - ps-bestplus
                  - ps-best2
                  - ps-mpath
                example: ps-all
          - class_name: rtmapSetEvpn
            doc_path: Routing%20and%20Forwarding/rtmap:SetEvpn/
            rn: sevpn
            type: single
            tf_name: set_evpn
            description: 'Set Evpn Gateway Ip Addr and Ether Tag.'
            attributes:
              - nxos_name: gwType
                tf_name: set_evpn_gateway_type
                type: String
                description: 'EVPN Gateway Address Type.'
                enum_values:
                  - ip-address
                  - nexthop
                example: ip-address
                exclude_test: true
              - nxos_name: ip
                tf_name: set_evpn_gateway_ip
                type: String
                description: 'EVPN Gateway IP Address.'
                example: 10.1.1.1
                exclude_test: true
          - class_name: rtmapMatchRtNh
            doc_path: Routing%20and%20Forwarding/rtmap:MatchRtNh/
            rn: mrtnh
            type: single
            tf_name: match_next_hop
            description: 'A match rule based on route next hops.'
            child_classes:
              - class_name: rtmapRsRtNhAtt
                doc_path: Routing%20and%20Forwarding/rtmap:RsRtNhAtt/
                rn: rtrtNhAtt-[%s]
                type: list
                tf_name: match_next_hop_prefix_lists
                description: 'List of Match Next Hop Prefix Lists.'
                attributes:
                  - nxos_name: tDn
                    tf_name: prefix_list_dn
                    type: String
                    description: 'DN of Prefix List. For example: `sys/rpm/pfxlistv4-[PREFIX_LIST1]`.'
                    example: sys/rpm/pfxlistv4-[PREFIX_LIST1]
                    id: true
          - class_name: rtmapMatchRegComm
            doc_path: Routing%20and%20Forwarding/rtmap:MatchRegComm/
            rn: mregcomm
            type: single
            tf_name: match_regular_community
            description: 'A match rule based on regular communities.'
            attributes:
              - nxos_name: criteria
                tf_name: match_regular_community_criteria
                type: String
                description: 'Criteria.'
                enum_values:
                  - exact
                  - sub-group
                example: exact
            child_classes:
              - class_name: rtmapRsRegCommAtt
                doc_path: Routing%20and%20Forwarding/rtmap:RsRegCommAtt/
                rn: rsregCommAtt-[%s]
                type: list
                tf_name: match_regular_community_lists
                description: 'List of Match Regular Community Lists.'
                attributes:
                  - nxos_name: tDn
                    tf_name: community_list_dn
                    type: String
                    description: 'DN of Community List. For example: `sys/rpm/rtregcom-[COMMUNITY_LIST1]`.'
                    example: sys/rpm/rtregcom-[COMMUNITY_LIST1]
                    id: true
          - class_name: rtmapMatchAsPathAccessList
            doc_path: Routing%20and%20Forwarding/rtmap:MatchAsPathAccessList/
            rn: mrtacclist
            type: single
            tf_name: match_as_path
            description: 'Match on AS-Path Access List configuration.'
            child_classes:
              - class_name: rtmapRsRtAsPathAccAtt
                doc_path: Routing%20and%20Forwarding/rtmap:RsRtAsPathAccAtt/
                rn: rtrtAsPathAccAtt-[%s]
                type: list
                tf_name: match_as_path_lists
                description: 'List of Match AS-Path Access Lists.'
                attributes:
                  - nxos_name: tDn
                    tf_name: as_path_access_list_dn
                    type: String
                    description: 'DN of AS-Path Access List. For example: `sys/rpm/accesslist-[AS_PATH_LIST1]`.'
                    example: sys/rpm/accesslist-[AS_PATH_LIST1]
                    id: true
          - class_name: rtmapMatchAsnAsPathAccessList
            doc_path: Routing%20and%20Forwarding/rtmap:MatchAsnAsPathAccessList/
            rn: mrtasnacclist
            type: single
            tf_name: match_as_number_as_path
            description: 'Match on ASN AS-Path Access List configuration.'
            child_classes:
              - class_name: rtmapRsRtAsnAsPathAccAtt
                doc_path: Routing%20and%20Forwarding/rtmap:RsRtAsnAsPathAccAtt/
                rn: rtrtAsnAsPathAccAtt-[%s]
                type: list
                tf_name: match_as_number_as_path_lists
                description: 'List of Match ASN AS-Path Access Lists.'
                attributes:
                  - nxos_name: tDn
                    tf_name: as_path_access_list_dn
                    type: String
                    description: 'DN of AS-Path Access List. For example: `sys/rpm/accesslist-[AS_PATH_LIST1]`.'
                    example: sys/rpm/accesslist-[AS_PATH_LIST1]
                    id: true
          - class_name: rtmapSetPrepend
            doc_path: Routing%20and%20Forwarding/rtmap:SetPrepend/
            rn: setaspathprepend
            type: single
            tf_name: set_as_path_prepend
            description: 'Set AS-Path Prepend configuration.'
            attributes:
              - nxos_name: as
                tf_name: set_as_path_prepend
                type: String
                description: 'As Path Prepend.'
                example: '65001 65001'
          - class_name: rtmapSetPrependLastAs
            doc_path: Routing%20and%20Forwarding/rtmap:SetPrependLastAs/
            rn: setaspathlastas
            type: single
            tf_name: set_as_path_prepend_last_as
            description: 'Set AS-Path Prepend Last AS configuration.'
            attributes:
              - nxos_name: lastas
                tf_name: set_as_path_prepend_last_as
                type: Int64
                description: 'LastAs.'
                min_int: 1
                max_int: 10
                example: 2
          - class_name: rtmapSetRtTag
            doc_path: Routing%20and%20Forwarding/rtmap:SetRtTag/
            rn: srttag
            type: single
            tf_name: set_tag
            description: 'Set Route Tag configuration.'
            attributes:
              - nxos_name: tag
                tf_name: set_tag
                type: Int64
                description: 'The color of a policy label.'
                min_int: 0
                max_int: 4294967295
                example: 12345
          - class_name: rtmapSetWeight
            doc_path: Routing%20and%20Forwarding/rtmap:SetWeight/
            rn: sweight
            type: single
            tf_name: set_weight
            description: 'Set Weight configuration.'
            attributes:
              - nxos_name: weight
                tf_name: set_weight
                type: Int64
                description: 'The weight of the fault in calculating the health score of an object. A higher weight causes a higher degradation of the health score of the affected object.'
                min_int: 0
                max_int: 65535
                example: 200
          - class_name: rtmapSetOrigin
            doc_path: Routing%20and%20Forwarding/rtmap:SetOrigin/
            rn: origin
            type: single
            tf_name: set_origin
            description: 'Set Origin configuration.'
            attributes:
              - nxos_name: asn
                tf_name: set_origin_asn
                type: Int64
                description: 'Autonomous System Number.'
                min_int: 1
                max_int: 4294967295
                example: 65001
              - nxos_name: originT
                tf_name: set_origin
                type: String
                description: 'Origin Type.'
                enum_values:
                  - egp
                  - igp
                  - incomplete
                example: egp
          - class_name: rtmapSetRttComm
            doc_path: Routing%20and%20Forwarding/rtmap:SetRttComm/
            rn: srtt
