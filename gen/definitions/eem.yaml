---
name: EEM
class_name: evmsEvtMgr
dn: sys/evtmgr
no_delete: true
ds_description: This data source can read the Embedded Event Manager (EEM) configuration on NX-OS devices, including environment variables and applets with their event specifications, event correlation and actions.
res_description: This resource can manage the Embedded Event Manager (EEM) configuration on NX-OS devices, including environment variables and applets with their event specifications, event correlation and actions.
doc_path: System/evms:EvtMgr/
doc_category: System
child_classes:
  - class_name: evmsInst
    doc_path: System/evms:Inst/
    rn: inst
    type: single
    no_delete: true
    description: 'Event manager instance.'
    child_classes:
      - class_name: evmsEnvironment
        doc_path: System/evms:Environment/
        rn: env-[%s]
        type: list
        tf_name: environment_variables
        description: 'List of event manager environment variables.'
        attributes:
          - nxos_name: envName
            tf_name: name
            type: String
            id: true
            description: 'Name of the environment variable.'
            example: TF_INTERFACE
          - nxos_name: envValue
            tf_name: value
            type: String
            description: 'Value of the environment variable.'
            example: eth1/10
      - class_name: evmsApplet
        doc_path: System/evms:Applet/
        rn: applet-[%s]
        type: list
        tf_name: applets
        description: 'List of event manager applets.'
        attributes:
          - nxos_name: appletName
            tf_name: name
            type: String
            id: true
            description: 'Name of the policy.'
            example: TF_APPLET
          - nxos_name: appletDescription
            tf_name: description
            type: String
            description: 'Description for the policy.'
            example: Terraform applet
          - nxos_name: appletOverride
            tf_name: override
            type: String
            description: 'Name of the system policy to override.'
            example: __pfm_fanbad_any_singlefan
            exclude_test: true
        example_entries:
          - name: TF_APPLICATION
            application_event_subsystem_id: 798
            application_event_type: 1
          - name: TF_CDP
            cdp_event_interface: eth1/10
            cdp_event_operation: add
          - name: TF_CLI
            cli_event_match: show terraform
            cli_event_occurrences: 2
            cli_event_time_interval: 10
          - name: TF_COUNTER
            counter_event_name: TF_COUNTER
            counter_event_entry_operator: gt
            counter_event_entry_value: 5
            counter_event_exit_operator: lt
            counter_event_exit_value: 2
          - name: TF_ETHPM
            ethpm_event_storm_control: true
          - name: TF_FAN_ABSENT
            fan_absent_event_fan: '1'
            fan_absent_event_time: 20
          - name: TF_FAN_BAD
            fan_bad_event_fan: '1'
            fan_bad_event_time: 20
          - name: TF_GOLD
            gold_event_module: 1
            gold_event_test_name: TestUSBPorts
            gold_event_testing_type: scheduled
            gold_event_severity: major
            gold_event_consecutive_failures: 2
          - name: TF_LINK_FLAP
            internal_link_flap_event_count: 2
            internal_link_flap_event_time: 60
          - name: TF_MEMORY
            memory_event_level: critical
          - name: TF_MODULE
            module_event_module: '1'
            module_event_status: online
          - name: TF_MODULE_FAILURE
            module_failure_event_module: '1'
            module_failure_event_error_type: lc-failed
            module_failure_event_count: 2
            module_failure_event_time: 60
          - name: TF_NONE
            none_event: true
          - name: TF_OIR
            oir_event_device_type: fan
            oir_event_type: remove
            oir_event_device_number: 1
          - name: TF_POLICY_DEFAULT
            override: __pfm_fanbad_any_singlefan
            policy_default_event_occurrences: 2
            policy_default_event_time_interval: 60
          - name: TF_POWER_OVER_BUDGET
            power_over_budget_event: true
          - name: TF_SNMP
            snmp_event_oid: 1.3.6.1.2.1.1.3.0
            snmp_event_get_type: exact
            snmp_event_entry_operator: lt
            snmp_event_entry_value: 1
            snmp_event_exit_operator: gt
            snmp_event_exit_value: 2
            snmp_event_poll_interval_minimum: 30
            snmp_event_poll_interval_maximum: 60
          - name: TF_SYSLOG
            syslog_event_pattern: terraform-test-pattern
            syslog_event_priority: alerts
            syslog_event_occurrences: 2
            syslog_event_time_interval: 60
          - name: TF_SYSMGR_MEMORY
            override: __sysmgr_policy_mem_alert
            sysmgr_memory_alert_event_minor: 70
            sysmgr_memory_alert_event_major: 80
            sysmgr_memory_alert_event_clear: 60
          - name: TF_SYSMGR_SWITCHOVER
            override: __sysmgr_swover_count_alert
            sysmgr_switchover_event_count: 3
            sysmgr_switchover_event_time: 120
          - name: TF_TEMPERATURE
            temperature_event_module: '1'
            temperature_event_sensor: '1'
            temperature_event_threshold: major
          - name: TF_TIMER
            timer_event_name: TF_TIMER
            timer_event_cron_time: '0 * * * *'
          - name: TF_TRACK
            track_event_id: 10
            track_event_state: down
          - name: TF_UFDM
            ufdm_event_fib: inconsistent
        child_classes:
          - class_name: evmsEvents
            doc_path: System/evms:Events/
            rn: events
            type: single
            description: 'Events of the applet.'
            child_classes:
              - class_name: evmsEventApplicationUnTagged
                doc_path: System/evms:EventApplicationUnTagged/
                rn: application
                type: single
                tf_name: application_event
                description: 'Untagged application event specification.'
                exclude_test: true
                attributes:
                  - nxos_name: subSystemId
                    tf_name: application_event_subsystem_id
                    type: Int64
                    min_int: 0
                    max_int: 4294967295
                    description: 'Sub-system ID that will publish the application event.'
                    example: 798
                  - nxos_name: eventType
                    tf_name: application_event_type
                    type: Int64
                    min_int: 0
                    max_int: 4294967295
                    description: 'Event type within the specified sub-system.'
                    example: 1
              - class_name: evmsEventCdpUnTagged
                doc_path: System/evms:EventCdpUnTagged/
                rn: cdp
                type: single
                tf_name: cdp_event
                description: 'Untagged CDP event specification.'
                exclude_test: true
                attributes:
                  - nxos_name: intf
                    tf_name: cdp_event_interface
                    type: String
                    description: 'Interface for CDP event manager config.'
                    example: eth1/10
                  - nxos_name: cacheEntryOp
                    tf_name: cdp_event_operation
                    type: String
                    enum_values:
                      - all
                      - add
                      - update
                      - delete
                    description: 'cdp event specification.'
                    example: add
              - class_name: evmsEventCliUnTagged
                doc_path: System/evms:EventCliUnTagged/
                rn: cli
                type: single
                tf_name: cli_event
                description: 'Untagged CLI event specification.'
                exclude_test: true
                attributes:
                  - nxos_name: match
                    tf_name: cli_event_match
                    type: String
                    description: 'CLI regular expression to be used for matching.'
                    example: show terraform
                  - nxos_name: occurrences
                    tf_name: cli_event_occurrences
                    type: Int64
                    min_int: 1
                    max_int: 65000
                    description: 'Enter an integer to be used as count.'
                    example: 2
                  - nxos_name: timeInterval
                    tf_name: cli_event_time_interval
                    type: Int64
                    min_int: 0
                    max_int: 10000000
                    description: 'Time interval in seconds.'
                    example: 10
              - class_name: evmsEventCounterUnTagged
                doc_path: System/evms:EventCounterUnTagged/
                rn: counter
                type: single
                tf_name: counter_event
                description: 'Untagged counter event specification.'
                exclude_test: true
                attributes:
                  - nxos_name: counterName
                    tf_name: counter_event_name
                    type: String
                    description: 'Name of the counter.'
                    example: TF_COUNTER
                  - nxos_name: entryOp
                    tf_name: counter_event_entry_operator
                    type: String
                    enum_values:
                      - gt
                      - ge
                      - eq
                      - ne
                      - lt
                      - le
                    description: 'Specify the comparison operator.'
                    example: gt
                  - nxos_name: entryValue
                    tf_name: counter_event_entry_value
                    type: Int64
                    min_int: 0
                    max_int: 2147483647
                    description: 'Specify the value for comparison with the counter Value.'
                    example: 5
                  - nxos_name: exitOp
                    tf_name: counter_event_exit_operator
                    type: String
                    enum_values:
                      - gt
                      - ge
                      - eq
                      - ne
                      - lt
                      - le
                    description: 'Specify the comparison operator.'
                    example: lt
                  - nxos_name: exitValue
                    tf_name: counter_event_exit_value
                    type: Int64
                    min_int: 0
                    max_int: 2147483647
                    description: 'Specify the value for comparison with the counter Value.'
                    example: 2
              - class_name: evmsEventEthpm
                doc_path: System/evms:EventEthpm/
                rn: ethpm
                type: single
                tf_name: ethpm_event
                description: 'Ethpm event specification.'
                exclude_test: true
                attributes:
                  - nxos_name: eventStrmCtrl
                    tf_name: ethpm_event_storm_control
                    type: Bool
                    description: 'Enable or Disable event storm-control config.'
                    example: true
              - class_name: evmsEventFanAbsentUnTagged
                doc_path: System/evms:EventFanAbsentUnTagged/
                rn: fanabsent
                type: single
                tf_name: fan_absent_event
                description: 'Fan absent event specification.'
                exclude_test: true
                attributes:
                  - nxos_name: fanNumber
                    tf_name: fan_absent_event_fan
                    type: String
                    description: 'Specify fan number, 0|all for all fan or interger range.'
                    example: '1'
                  - nxos_name: time
                    tf_name: fan_absent_event_time
                    type: Int64
                    min_int: 10
                    max_int: 64000
                    description: 'Time in seconds fan can stay absent.'
                    example: 20
              - class_name: evmsEventFanBadUnTagged
                doc_path: System/evms:EventFanBadUnTagged/
                rn: fanbad
                type: single
                tf_name: fan_bad_event
                description: 'Fan bad event specification.'
                exclude_test: true
                attributes:
                  - nxos_name: fanNumber
                    tf_name: fan_bad_event_fan
                    type: String
                    description: 'Specify fan number, 0|all for all fan or interger range.'
                    example: '1'
                  - nxos_name: time
                    tf_name: fan_bad_event_time
                    type: Int64
                    min_int: 10
                    max_int: 64000
                    description: 'Time in seconds fan can stay absent.'
                    example: 20
              - class_name: evmsEventGold
                doc_path: System/evms:EventGold/
                rn: gold
                type: single
                tf_name: gold_event
                description: 'GOLD (Generic Online Diagnostics) event specification.'
                exclude_test: true
                attributes:
                  - nxos_name: modId
                    tf_name: gold_event_module
                    type: Int64
                    min_int: 0
                    max_int: 4294967295
                    description: 'Module id for which the event shall be triggered on diag test failure.'
                    example: 1
                  - nxos_name: moduleAll
                    tf_name: gold_event_module_all
                    type: String
                    enum_values:
                      - enabled
                      - disabled
                    description: 'All Module of sys for which the event shall be triggered on diag test failure.'
                    example: enabled
                  - nxos_name: diagTestName
                    tf_name: gold_event_test_name
                    type: String
                    description: 'Name of the online Diagnostic test which is run.'
                    example: TestUSBPorts
                  - nxos_name: testingType
                    tf_name: gold_event_testing_type
                    type: String
                    enum_values:
                      - scheduled
                      - monitoring
                    description: 'Diagnostics Testing type.'
                    example: scheduled
                  - nxos_name: failureSeverity
                    tf_name: gold_event_severity
                    type: String
                    enum_values:
                      - minor
                      - moderate
                      - major
                    description: 'Diag failure severity level.'
                    example: major
                  - nxos_name: consectiFailCnt
                    tf_name: gold_event_consecutive_failures
                    type: Int64
                    min_int: 0
                    max_int: 4294967295
                    description: 'Diag consecutive Failure count.'
                    example: 2
              - class_name: evmsEventInternalLinkFlapUnTagged
                doc_path: System/evms:EventInternalLinkFlapUnTagged/
                rn: internallinkflap
                type: single
                tf_name: internal_link_flap_event
                description: 'Internal link flap event specification.'
                exclude_test: true
                attributes:
                  - nxos_name: count
                    tf_name: internal_link_flap_event_count
                    type: Int64
                    min_int: 0
                    max_int: 65000
                    description: 'Integer number to be used as count.'
                    example: 2
                  - nxos_name: time
                    tf_name: internal_link_flap_event_time
                    type: Int64
                    min_int: -1
                    max_int: 10000000
                    description: 'Time interval within which the events need to happen.'
                    example: 60
              - class_name: evmsEventMemoryUnTagged
                doc_path: System/evms:EventMemoryUnTagged/
                rn: memory
                type: single
                tf_name: memory_event
                description: 'Memory level event specification.'
                exclude_test: true
                attributes:
                  - nxos_name: memLevels
                    tf_name: memory_event_level
                    type: String
                    enum_values:
                      - minor
                      - severe
                      - critical
                    description: 'Specify memory level: minor, major, critical.'
                    example: critical
              - class_name: evmsEventModuleUnTagged
                doc_path: System/evms:EventModuleUnTagged/
                rn: module
                type: single
                tf_name: module_event
                description: 'Untagged module event specification.'
                exclude_test: true
                attributes:
                  - nxos_name: moduleNumber
                    tf_name: module_event_module
                    type: String
                    description: 'Module number for event module.'
                    example: '1'
                  - nxos_name: moduleStatus
                    tf_name: module_event_status
                    type: String
                    enum_values:
                      - online
                      - offline
                      - any
                    description: 'Module status for event module.'
                    example: online
              - class_name: evmsEventModuleFailureUnTagged
                doc_path: System/evms:EventModuleFailureUnTagged/
                rn: modulefailure
                type: single
                tf_name: module_failure_event
                description: 'Untagged module failure event specification.'
                exclude_test: true
                attributes:
                  - nxos_name: moduleNumber
                    tf_name: module_failure_event_module
                    type: String
                    description: 'Module number for event module-failure.'
                    example: '1'
                  - nxos_name: errType
                    tf_name: module_failure_event_error_type
                    type: String
                    enum_values:
                      - unexpected-registration
                      - registration-failure
                      - registration-timeout
                      - runtime-diag-failure
                      - runtime-diag-timeout
                      - lc-ready-timeout
                      - lc-failed
                      - lc-not-responding
                      - lc-sw-failure
                      - image-upgrade-failed
                      - sequence-timeout
                      - hitless-upgrade-reg-failure
                      - hitless-upgrade-diag-failure
                      - hitless-upgrade-procmgr-notif
                      - hitless-upgrade-seq-timeout
                      - upgrade-srg-not-compatible
                      - hitless-upgrade-failure
                      - srg-info-resp-timeout
                      - image-download-failed
                      - insertion-seq-failure
                      - addon-sequence-failure
                      - any
                    description: 'Error type for event module-failure.'
                    example: lc-failed
                  - nxos_name: count
                    tf_name: module_failure_event_count
                    type: Int64
                    min_int: 0
                    max_int: 65000
                    description: 'Integer number to be used as count.'
                    example: 2
                  - nxos_name: time
                    tf_name: module_failure_event_time
                    type: Int64
                    min_int: -1
                    max_int: 10000000
                    description: 'Time interval within which the events need to happen.'
                    example: 60
              - class_name: evmsEventNoneUnTagged
                doc_path: System/evms:EventNoneUnTagged/
                rn: none
                type: single
                tf_name: none_event
                description: 'Untagged none event specification to run the policy manually. Requires the `evmed` feature.'
                exclude_test: true
                attributes:
                  - nxos_name: eventnonestatus
                    tf_name: none_event
                    type: Bool
                    description: 'Manually run policy untagged event with none.'
                    example: true
              - class_name: evmsEventOirUnTagged
                doc_path: System/evms:EventOirUnTagged/
                rn: oir
                type: single
                tf_name: oir_event
                description: 'Untagged OIR (Online Insertion and Removal) event specification.'
                exclude_test: true
                attributes:
                  - nxos_name: deviceType
                    tf_name: oir_event_device_type
                    type: String
                    enum_values:
                      - fan
                      - module
                      - powersupply
                    description: 'Device type for event oir.'
                    example: fan
                  - nxos_name: oirType
                    tf_name: oir_event_type
                    type: String
                    enum_values:
                      - insert
                      - remove
                      - anyoir
                    description: 'Oir type for event oir.'
                    example: remove
                  - nxos_name: deviceNumber
                    tf_name: oir_event_device_number
                    type: Int64
                    min_int: 0
                    max_int: 32
                    description: 'Device number matching with device type.'
                    example: 1
              - class_name: evmsEventPolicyDefault
                doc_path: System/evms:EventPolicyDefault/
                rn: policydefault
                type: single
                tf_name: policy_default_event
                description: 'Use the event in the system policy being overridden. Only applicable to applets overriding a system policy.'
                exclude_test: true
                attributes:
                  - nxos_name: disable
                    tf_name: policy_default_event_disable
                    type: Bool
                    description: 'Disable all events.'
                    example: true
                  - nxos_name: occurences
                    tf_name: policy_default_event_occurrences
                    type: Int64
                    min_int: 1
                    max_int: 65000
                    description: 'Number of occurances.'
                    example: 2
                  - nxos_name: timeInterval
                    tf_name: policy_default_event_time_interval
                    type: Int64
                    min_int: 0
                    max_int: 32768
                    description: 'Time interval in seconds.'
                    example: 60
              - class_name: evmsEventPowerOverBudgetUnTagged
                doc_path: System/evms:EventPowerOverBudgetUnTagged/
                rn: poweroverbudget
                type: single
                tf_name: power_over_budget_event
                description: 'Power over budget event specification.'
                exclude_test: true
                attributes:
                  - nxos_name: eventpoweroverbudgetstatus
                    tf_name: power_over_budget_event
                    type: Bool
                    description: 'Event power over budget.'
                    example: true
              - class_name: evmsEventSnmpUnTagged
                doc_path: System/evms:EventSnmpUnTagged/
                rn: snmp
                type: single
                tf_name: snmp_event
                description: 'Untagged SNMP event specification.'
                exclude_test: true
                attributes:
                  - nxos_name: oid
                    tf_name: snmp_event_oid
                    type: String
                    description: 'Oid of data element in dot notation.'
                    example: 1.3.6.1.2.1.1.3.0
                  - nxos_name: getType
                    tf_name: snmp_event_get_type
                    type: String
                    enum_values:
                      - none
                      - exact
                      - next
                    description: 'The type of SNMP get operation.'
                    example: exact
                  - nxos_name: entryOp
                    tf_name: snmp_event_entry_operator
                    type: String
                    enum_values:
                      - none
                      - gt
                      - ge
                      - eq
                      - ne
                      - lt
                      - le
                    description: 'Entry comparison operator.'
                    example: lt
                  - nxos_name: entryVal
                    tf_name: snmp_event_entry_value
                    type: Int64
                    min_int: 0
                    description: 'Value to compare with the current polled value.'
                    example: 1
                  - nxos_name: exitComb
                    tf_name: snmp_event_exit_combination
                    type: String
                    enum_values:
                      - none
                      - or
                      - and
                    description: 'Exit criterion combination.'
                    example: or
                  - nxos_name: exitOp
                    tf_name: snmp_event_exit_operator
                    type: String
                    enum_values:
                      - none
                      - gt
                      - ge
                      - eq
                      - ne
                      - lt
                      - le
                    description: 'Exit comparison operator.'
                    example: gt
                  - nxos_name: exitVal
                    tf_name: snmp_event_exit_value
                    type: Int64
                    min_int: 0
                    description: 'Value to compare with the current polled value.'
                    example: 2
                  - nxos_name: exitOp1
                    tf_name: snmp_event_exit_operator_1
                    type: String
                    enum_values:
                      - none
                      - gt
                      - ge
                      - eq
                      - ne
                      - lt
                      - le
                    description: 'Exit comparison operator.'
                    example: ge
                  - nxos_name: exitVal1
                    tf_name: snmp_event_exit_value_1
                    type: Int64
                    min_int: 0
                    description: 'Value to compare with the current polled value.'
                    example: 3
                  - nxos_name: exitTimeMin
                    tf_name: snmp_event_exit_time_minimum
                    type: Int64
                    min_int: 0
                    max_int: 4294967295
                    description: 'Min Exit time value required.'
                    example: 10
                  - nxos_name: exitTimeMax
                    tf_name: snmp_event_exit_time_maximum
                    type: Int64
                    min_int: 0
                    max_int: 4294967295
                    description: 'Max Exit time value required.'
                    example: 20
                  - nxos_name: pollIntervalMin
                    tf_name: snmp_event_poll_interval_minimum
                    type: Int64
                    min_int: 1
                    max_int: 2147483647
                    description: 'Min Polling time interval.'
                    example: 30
                  - nxos_name: pollIntervalMax
                    tf_name: snmp_event_poll_interval_maximum
                    type: Int64
                    min_int: 1
                    max_int: 2147483647
                    description: 'Max Polling time interval.'
                    example: 60
              - class_name: evmsEventSyslogUnTagged
                doc_path: System/evms:EventSyslogUnTagged/
                rn: syslog
                type: single
                tf_name: syslog_event
                description: 'Untagged syslog event specification.'
                exclude_test: true
                attributes:
                  - nxos_name: pattern
                    tf_name: syslog_event_pattern
                    type: String
                    description: 'Syslog pattern text of the syslog message.'
                    example: terraform-test-pattern
                  - nxos_name: priority
                    tf_name: syslog_event_priority
                    type: String
                    enum_values:
                      - '0'
                      - '1'
                      - '2'
                      - '3'
                      - '4'
                      - '5'
                      - '6'
                      - '7'
                      - alerts
                      - critical
                      - debugging
                      - emergencies
                      - errors
                      - informational
                      - notifications
                      - warnings
                      - none
                    description: 'Priority of the syslog message.'
                    example: alerts
                  - nxos_name: occurences
                    tf_name: syslog_event_occurrences
                    type: Int64
                    min_int: 1
                    max_int: 65000
                    description: 'Number of occurances.'
                    example: 2
                  - nxos_name: timeInterval
                    tf_name: syslog_event_time_interval
                    type: Int64
                    min_int: 0
                    max_int: 4294967295
                    description: 'Time interval in seconds.'
                    example: 60
              - class_name: evmsEventSysmgrMemAlertUnTagged
                doc_path: System/evms:EventSysmgrMemAlertUnTagged/
                rn: sysmgrmemalert
                type: single
                tf_name: sysmgr_memory_alert_event
                description: 'System manager memory alert event specification. Only applicable to applets overriding a system policy.'
                exclude_test: true
                attributes:
                  - nxos_name: module
                    tf_name: sysmgr_memory_alert_event_module
                    type: Int64
                    min_int: 0
                    max_int: 4294967295
                    description: 'module number optional.'
                    example: 1
                  - nxos_name: minor
                    tf_name: sysmgr_memory_alert_event_minor
                    type: Int64
                    min_int: 0
                    max_int: 99
                    description: 'Minor memory threshold between 1 to 99.'
                    example: 70
                  - nxos_name: major
                    tf_name: sysmgr_memory_alert_event_major
                    type: Int64
                    min_int: 0
                    max_int: 99
                    description: 'Major memory threshold between 1 to 99.'
                    example: 80
                  - nxos_name: clear
                    tf_name: sysmgr_memory_alert_event_clear
                    type: Int64
                    min_int: 0
                    max_int: 99
                    description: 'clear memory threshold between 1 to 99.'
                    example: 60
              - class_name: evmsEventSysmgrSwitchoverUnTagged
                doc_path: System/evms:EventSysmgrSwitchoverUnTagged/
                rn: sysmgrswitchover
                type: single
                tf_name: sysmgr_switchover_event
                description: 'System manager switchover event specification. Only applicable to applets overriding a system policy.'
                exclude_test: true
                attributes:
                  - nxos_name: count
                    tf_name: sysmgr_switchover_event_count
                    type: Int64
