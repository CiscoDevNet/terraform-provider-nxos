---
name: EPBR
class_name: epbrEntity
dn: sys/epbr
ds_description: This data source can read the Enhanced Policy-Based Redirect (ePBR) configuration on NX-OS devices, including services with layer-3, layer-2 and DPU endpoints, reverse endpoints and probes, service chains, failover groups, policies with matches and sequences, VRF redirection, infra VLANs and interface policy attachments.
res_description: This resource can manage the Enhanced Policy-Based Redirect (ePBR) configuration on NX-OS devices, including services with layer-3, layer-2 and DPU endpoints, reverse endpoints and probes, service chains, failover groups, policies with matches and sequences, VRF redirection, infra VLANs and interface policy attachments.
doc_path: Routing%20and%20Forwarding/epbr:Entity/
doc_category: Routing
child_classes:
  - class_name: epbrInst
    doc_path: Routing%20and%20Forwarding/epbr:Inst/
    rn: inst
    type: single
    tf_name: instance
    description: 'ePBR instance.'
    child_classes:
      - class_name: epbrService
        doc_path: Routing%20and%20Forwarding/epbr:Service/
        rn: service-[%s]
        type: list
        tf_name: services
        description: 'List of ePBR services.'
        attributes:
          - nxos_name: name
            tf_name: name
            type: String
            id: true
            description: 'The name of the object.'
            example: SVC1
          - nxos_name: adminState
            tf_name: admin_state
            type: String
            description: 'Administrative state for EPBR service.'
            enum_values:
              - noShut
              - shut
            example: shut
          - nxos_name: connMode
            tf_name: connection_mode
            type: String
            description: 'Connection mode.'
            enum_values:
              - full-duplex
              - half-duplex
            example: full-duplex
          - nxos_name: holdDownThreshCount
            tf_name: hold_down_threshold_count
            type: Int64
            min_int: 0
            max_int: 10
            description: 'Threshold count for EPBR service.'
            example: 3
          - nxos_name: holdDownThreshTime
            tf_name: hold_down_threshold_time
            type: Int64
            min_int: 0
            max_int: 86400
            description: 'Threshold time for EPBR service.'
            example: 100
          - nxos_name: reverseSecGroup
            tf_name: reverse_security_group
            type: Int64
            min_int: 0
            max_int: 65535
            description: 'reverse security group.'
            example: 200
          - nxos_name: secGroup
            tf_name: security_group
            type: Int64
            min_int: 0
            max_int: 65535
            description: 'forward security group.'
            example: 100
          - nxos_name: svcIntf
            tf_name: service_interface
            type: String
            description: 'Service interface.'
            example: eth1/10
          - nxos_name: thresholdHigh
            tf_name: threshold_high
            type: Int64
            min_int: 0
            max_int: 100
            description: 'min active endpoints to be declared UP.'
            example: 60
            exclude_test: true
          - nxos_name: thresholdLow
            tf_name: threshold_low
            type: Int64
            min_int: 0
            max_int: 100
            description: 'max active endpoints to be declared DOWN.'
            example: 20
            exclude_test: true
          - nxos_name: thresholdUp
            tf_name: threshold_up
            type: Int64
            min_int: 0
            max_int: 100
            description: 'Minimum percentage of active endpoints for service to be declared UP.'
            example: 50
          - nxos_name: type
            tf_name: type
            type: String
            description: 'The specific type of the object or component.'
            enum_values:
              - l3
              - l2
              - dpu
              - l3-redirect
            example: l3
          - nxos_name: vrf
            tf_name: vrf
            type: String
            description: 'Identifies the VRF for the NTP providers.'
            example: default
        child_classes:
          - class_name: epbrProbe
            doc_path: Routing%20and%20Forwarding/epbr:Probe/
            rn: probe
            type: single
            tf_name: probe
            description: 'ePBR service probe.'
            attributes:
              - nxos_name: ctrlStatusEnable
                tf_name: probe_control
                type: String
                description: 'Probe control status.'
                enum_values:
                  - disable
                  - enable
                example: enable
              - nxos_name: dnshost
                tf_name: probe_dns_host
                type: String
                description: 'DNS host name.'
                example: www.example.com
                exclude_test: true
              - nxos_name: frequency
                tf_name: probe_frequency
                type: Int64
                min_int: 0
                max_int: 604800
                description: 'Probe frequency.'
                example: 5
              - nxos_name: httpGetStr
                tf_name: probe_http_get
                type: String
                description: 'HTTP get string.'
                example: index.html
                exclude_test: true
              - nxos_name: httpVersion
                tf_name: probe_http_version
                type: String
                description: "HTTP version number, Supported HTTP versions are '1.0' and '1.1'."
                example: '1.1'
                exclude_test: true
              - nxos_name: port
                tf_name: probe_port
                type: Int64
                min_int: 0
                max_int: 65535
                description: 'The service port number for the LDAP service.'
                example: 80
              - nxos_name: probeIp
                tf_name: probe_ip
                type: String
                description: 'Probe IP address.'
                example: 10.1.1.100
                exclude_test: true
              - nxos_name: protocol
                tf_name: probe_protocol
                type: String
                description: 'The transfer protocol to be used for data export.'
                enum_values:
                  - noProtocol
                  - DNS
                  - HTTP
                  - ICMP
                  - TCP
                  - UDP
                  - IP
                  - LinkState
                  - CTP
                example: TCP
              - nxos_name: retryDownCount
                tf_name: probe_retry_down_count
                type: Int64
                min_int: 0
                max_int: 5
                description: 'Probe retry down count.'
                example: 2
              - nxos_name: retryUpCount
                tf_name: probe_retry_up_count
                type: Int64
                min_int: 0
                max_int: 5
                description: 'Probe retry up count.'
                example: 2
              - nxos_name: revSourceIntf
                tf_name: probe_reverse_source_interface
                type: String
                description: 'Resource source interface for probe.'
                example: lo123
              - nxos_name: sourceIntf
                tf_name: probe_source_interface
                type: String
                description: 'Probe source interface.'
                example: lo123
              - nxos_name: timeout
                tf_name: probe_timeout
                type: Int64
                min_int: 0
                max_int: 604800
                description: 'The amount of time between authentication attempts.'
                example: 3
              - nxos_name: trackID
                tf_name: probe_track_id
                type: Int64
                min_int: 0
                max_int: 512
                description: 'Probe track ID.'
                example: 10
                exclude_test: true
