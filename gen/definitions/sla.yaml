            rn: type-%s-port-%v-ip-[%s]
            type: list
            tf_name: permanent_responders
            description: 'List of permanent responders.'
            attributes:
              - nxos_name: protocol
                tf_name: protocol
                type: String
                id: true
                description: 'Responder protocol types supported types are udp-echo, tcp-connect.'
                enum_values:
                  - udp
                  - tcp
                example: udp
              - nxos_name: port
                tf_name: port
                type: Int64
                id: true
                min_int: 1
                max_int: 65535
                description: 'Port on which the responder is listenening to receive the packets from the sender. This property is applicable only for TCP or UDP protocol. Required only if ip sla sender probe''s control is disabled. Permanently enables the responder functionality on the specified port.'
                example: 5000
              - nxos_name: ipAddress
                tf_name: ip_address
                type: String
                id: true
                description: 'IP on which the responder is listenening to receive the packets from the sender. This property is applicable only for TCP or UDP protocol. Required only if ip sla sender probe''s control is disabled. Permanently enables the responder functionality on the specified port and IP. If the user needs wild card IP address, then use 0.0.0.0(any IP).'
                example: '10.1.1.1'
          - class_name: slaTwampResponder
            doc_path: Communication/sla:TwampResponder/
            rn: twampresponder
            type: single
            tf_name: twamp_responder
            description: 'TWAMP responder configuration.'
            attributes:
              - nxos_name: adminState
                tf_name: twamp_responder_admin_state
                type: Bool
                description: 'Enable or disable the twamp responder. To enable twamp responder, feature sla responder is to be enabled.'
                example: true
              - nxos_name: timeout
                tf_name: twamp_responder_timeout
                type: Int64
                min_int: 1
                max_int: 604800
                description: 'TWAMP Responder Session inactivity timeout in seconds (default 900).'
                example: 600
      - class_name: slaTwampServer
        doc_path: Communication/sla:TwampServer/
        rn: twampserver
        type: single
        tf_name: twamp_server
        description: 'TWAMP server configuration.'
        attributes:
          - nxos_name: adminState
            tf_name: twamp_server_admin_state
            type: Bool
            description: 'Enable or disable the ip sla twamp server. To enable twamp-server, feature sla twamp-server is to be enabled.'
            example: true
          - nxos_name: inactivityTimer
            tf_name: twamp_server_inactivity_timer
            type: Int64
            min_int: 1
            max_int: 6000
            description: 'TWAMP Server Inactivity Timer, Max number of inactive seconds (default 900).'
            example: 600
          - nxos_name: loggingLevel
            tf_name: twamp_server_logging_level
            type: Int64
            write_only: true
            min_int: 0
            max_int: 7
            description: 'configures the logging level for twamp server. The property can be set only if feature sla twamp-server is enabled.'
            example: 5
          - nxos_name: port
            tf_name: twamp_server_port
            type: Int64
            min_int: 1
            max_int: 65535
            description: 'TWAMP Server Port on which the TCP control connection is established.(default 862).'
            example: 5862
