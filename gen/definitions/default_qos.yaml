---
name: Default QoS
class_name: ipqosDefaultQoS
dn: sys/ipqos/dflt
no_delete: true
ds_description: This data source can read the default QoS configuration on NX-OS devices, including class maps with DSCP matching and policy maps with policing and QoS group settings.
res_description: This resource can manage the default QoS configuration on NX-OS devices, including class maps with DSCP matching and policy maps with policing and QoS group settings.
doc_path: Qos/ipqos:DefaultQoS/
doc_category: Quality of Service
child_classes:
  - class_name: ipqosCMapEntity
    doc_path: Qos/ipqos:CMapEntity/
    rn: c
    type: single
    no_delete: true
    child_classes:
      - class_name: ipqosCMapInst
        doc_path: Qos/ipqos:CMapInst/
        rn: name-%s
        type: list
        tf_name: class_maps
        description: 'List of class maps.'
        attributes:
          - nxos_name: name
            tf_name: name
            type: String
            id: true
            description: 'Name of class-map.'
            example: Voice
          - nxos_name: matchType
            tf_name: match_type
            type: String
            description: 'Match-any, match-all or match-first.'
            enum_values:
              - match-any
              - match-all
              - match-first
            example: match-any
        child_classes:
          - class_name: ipqosDscp
            rn: dscp-%v
            type: list
            tf_name: dscp_values
            description: 'List of DSCP values to match.'
            doc_path: Qos/ipqos:Dscp/
            attributes:
              - nxos_name: val
                tf_name: value
                type: String
                id: true
                description: 'Dscp value.'
                example: ef
          - class_name: ipqosNotDscp
            rn: dscpNot-%v
            type: list
            tf_name: not_dscp_values
            description: 'List of DSCP values to not match.'
            doc_path: Qos/ipqos:NotDscp/
            attributes:
              - nxos_name: val
                tf_name: value
                type: String
                id: true
                description: 'Not dscp value.'
                example: af11
          - class_name: ipqosDscpTunnel
            rn: dscptunnel-%v
            type: list
            tf_name: dscp_tunnel_values
            description: 'List of outer DSCP values to match.'
            exclude_test: true
            doc_path: Qos/ipqos:DscpTunnel/
            attributes:
              - nxos_name: val
                tf_name: value
                type: String
                id: true
                description: 'Outer DSCP value to match.'
                example: af22
          - class_name: ipqosCos
            rn: cos-%v
            type: list
            tf_name: cos_values
            description: 'List of CoS values to match.'
            doc_path: Qos/ipqos:Cos/
            attributes:
              - nxos_name: val
                tf_name: value
                type: Int64
                id: true
                description: 'Cos value.'
                min_int: 0
                max_int: 7
                example: 3
          - class_name: ipqosNotCos
            rn: cosNot-%v
            type: list
            tf_name: not_cos_values
            description: 'List of CoS values to not match.'
            doc_path: Qos/ipqos:NotCos/
            attributes:
              - nxos_name: val
                tf_name: value
                type: Int64
                id: true
                description: 'Not cos value.'
                min_int: 0
                max_int: 7
                example: 5
          - class_name: ipqosPrecedence
            rn: precedence-%v
            type: list
            tf_name: precedence_values
            description: 'List of precedence values to match.'
            doc_path: Qos/ipqos:Precedence/
            attributes:
              - nxos_name: val
                tf_name: value
                type: String
                id: true
                description: 'Precedence value.'
                enum_values:
                  - routine
                  - priority
                  - immediate
                  - flash
                  - flash-override
                  - critical
                  - internet
                  - network
                example: critical
          - class_name: ipqosNotPrecedence
            rn: precedenceNot-%v
            type: list
            tf_name: not_precedence_values
            description: 'List of precedence values to not match.'
            doc_path: Qos/ipqos:NotPrecedence/
            attributes:
              - nxos_name: val
                tf_name: value
                type: String
                id: true
                description: 'Not precedence value.'
                enum_values:
                  - routine
                  - priority
                  - immediate
                  - flash
                  - flash-override
                  - critical
                  - internet
                  - network
                example: flash
          - class_name: ipqosQoSGrp
            rn: grp-%v
            type: list
            tf_name: qos_group_values
            description: 'List of QoS group values to match.'
            exclude_test: true
            doc_path: Qos/ipqos:QoSGrp/
            attributes:
              - nxos_name: id
                tf_name: value
                type: Int64
                id: true
                description: 'QoS group ID.'
                min_int: 0
                max_int: 7
                example: 2
          - class_name: ipqosAcl
            rn: acl-[%s]
            type: list
            tf_name: access_groups
            description: 'List of ACLs to match.'
            doc_path: Qos/ipqos:Acl/
            attributes:
              - nxos_name: name
                tf_name: name
                type: String
                id: true
                description: 'Match using ACL.'
                example: ACL1
  - class_name: ipqosPMapEntity
    doc_path: Qos/ipqos:PMapEntity/
    rn: p
    type: single
    no_delete: true
    child_classes:
      - class_name: ipqosPMapInst
        doc_path: Qos/ipqos:PMapInst/
        rn: name-%s
        type: list
        tf_name: policy_maps
        description: 'List of policy maps.'
        attributes:
          - nxos_name: name
            tf_name: name
            type: String
            id: true
            description: 'Name of policy-map.'
            example: PM1
          - nxos_name: matchType
            tf_name: match_type
            type: String
            description: 'Match-any, match-all or match-first.'
            enum_values:
              - match-any
              - match-all
              - match-first
            example: match-any
        child_classes:
          - class_name: ipqosMatchCMap
            doc_path: Qos/ipqos:MatchCMap/
            rn: cmap-%s
            type: list
            tf_name: match_class_maps
            description: 'List of match class maps.'
            attributes:
              - nxos_name: name
                tf_name: name
                type: String
                id: true
                description: 'Match using class-map.'
                example: Voice
              - nxos_name: nextCMap
                tf_name: next_class_map
                type: String
                description: 'Insert before the given class-map.'
                example: Voice
                exclude_test: true
              - nxos_name: prevCMap
                tf_name: previous_class_map
                type: String
                description: 'Insert after the given class-map.'
                example: Voice
                exclude_test: true
            child_classes:
              - class_name: ipqosSetQoSGrp
                doc_path: Qos/ipqos:SetQoSGrp/
                rn: setGrp
                type: single
                tf_name: set_qos_group
                description: 'Set QoS group configuration.'
                attributes:
                  - nxos_name: id
                    tf_name: set_qos_group_id
                    type: Int64
                    description: 'QoS group ID.'
                    min_int: 0
                    max_int: 7
                    example: 1
              - class_name: ipqosSetDscp
                doc_path: Qos/ipqos:SetDscp/
                rn: setDscp
                type: single
                tf_name: set_dscp
                description: 'Set DSCP configuration.'
                attributes:
                  - nxos_name: tunnel
                    tf_name: set_dscp_tunnel
                    type: Bool
                    description: 'set dscp tunnel on or off.'
                    example: false
                  - nxos_name: val
                    tf_name: set_dscp_value
                    type: String
                    description: 'Dscp value.'
                    example: af21
              - class_name: ipqosSetDscpTunnel
                doc_path: Qos/ipqos:SetDscpTunnel/
                rn: setdscptunnel
                type: single
                tf_name: set_dscp_tunnel
                description: 'Set DSCP tunnel configuration.'
                exclude_test: true
                attributes:
                  - nxos_name: val
                    tf_name: set_dscp_tunnel_value
                    type: String
                    description: 'Dscp value for setting outer header.'
                    example: af31
              - class_name: ipqosSetCos
                doc_path: Qos/ipqos:SetCos/
                rn: setCos
                type: single
                tf_name: set_cos
                description: 'Set CoS configuration.'
                attributes:
                  - nxos_name: val
                    tf_name: set_cos_value
                    type: String
                    description: 'Cos value.'
                    enum_values:
                      - "0"
                      - "1"
                      - "2"
                      - "3"
                      - "4"
                      - "5"
                      - "6"
                      - "7"
                      - None
                    example: "3"
              - class_name: ipqosSetPrecedence
                doc_path: Qos/ipqos:SetPrecedence/
                rn: setPrecedence
                type: single
                tf_name: set_precedence
                description: 'Set precedence configuration.'
                attributes:
                  - nxos_name: tunnel
                    tf_name: set_precedence_tunnel
                    type: Bool
                    description: 'tunnel on or off.'
                    example: false
                  - nxos_name: val
                    tf_name: set_precedence_value
                    type: String
                    description: 'Precedence value.'
                    enum_values:
                      - routine
                      - priority
                      - immediate
                      - flash
                      - flash-override
                      - critical
                      - internet
                      - network
                    example: critical
              - class_name: ipqosPolice
                doc_path: Qos/ipqos:Police/
                rn: police
                type: single
                tf_name: police
                description: 'Police configuration.'
                attributes:
                  - nxos_name: bcRate
                    tf_name: police_bc_rate
                    type: Int64
                    description: 'CIR burst.'
                    min_int: 0
                    max_int: 536870912
                    example: 200
                  - nxos_name: bcUnit
                    tf_name: police_bc_unit
                    type: String
                    description: 'CIR burst unit.'
                    enum_values:
                      - unspecified
                      - bytes
                      - kbytes
                      - mbytes
                      - ms
                      - us
                      - packets
                    example: mbytes
                  - nxos_name: beRate
                    tf_name: police_be_rate
                    type: Int64
                    description: 'PIR burst.'
                    min_int: 0
                    max_int: 536870912
                    example: 200
                  - nxos_name: beUnit
                    tf_name: police_be_unit
                    type: String
                    description: 'PIR burst unit.'
                    enum_values:
                      - unspecified
                      - bytes
                      - kbytes
                      - mbytes
                      - ms
                      - us
                      - packets
                    example: mbytes
                  - nxos_name: cirRate
                    tf_name: police_cir_rate
                    type: Int64
                    description: 'CIR.'
                    min_int: 0
                    max_int: 100000000000
                    example: 10000
                  - nxos_name: cirUnit
                    tf_name: police_cir_unit
                    type: String
                    description: 'CIR unit.'
                    enum_values:
                      - unspecified
                      - bps
                      - kbps
                      - mbps
                      - gbps
                      - pps
                      - pct
                    example: mbps
                  - nxos_name: conformAction
                    tf_name: police_conform_action
                    type: String
                    description: 'Conform action.'
                    enum_values:
                      - unspecified
                      - transmit
                      - drop
                      - set-cos-transmit
                      - set-dscp-transmit
                      - set-prec-transmit
                      - set-qos-transmit
                    example: set-dscp-transmit
                  - nxos_name: conformSetCosTransmit
                    tf_name: police_conform_set_cos
                    type: Int64
                    description: 'set cos for conforming traffic.'
                    min_int: 0
                    max_int: 7
                    example: 0
                  - nxos_name: conformSetDscpTransmit
                    tf_name: police_conform_set_dscp
                    type: String
                    description: 'set dscp for conforming traffic.'
                    example: af22
                  - nxos_name: conformSetPrecTransmit
                    tf_name: police_conform_set_precedence
                    type: String
                    description: 'set precedence for conforming traffic.'
                    enum_values:
                      - routine
                      - priority
                      - immediate
                      - flash
                      - flash-override
                      - critical
                      - internet
                      - network
                    example: routine
                  - nxos_name: conformSetQosGrpTransmit
                    tf_name: police_conform_set_qos_group
                    type: Int64
                    description: 'set qos-group for conforming traffic.'
                    min_int: 0
                    max_int: 7
                    example: 0
                  - nxos_name: exceedAction
                    tf_name: police_exceed_action
                    type: String
                    description: 'Exceed action.'
                    enum_values:
                      - unspecified
                      - transmit
                      - drop
                      - set-cos-transmit
                      - set-dscp-transmit
                      - set-prec-transmit
                      - set-qos-transmit
                    example: set-dscp-transmit
                  - nxos_name: exceedSetCosTransmit
                    tf_name: police_exceed_set_cos
                    type: Int64
                    description: 'set cos for exceeding traffic.'
                    min_int: 0
                    max_int: 7
                    example: 0
                  - nxos_name: exceedSetDscpTransmit
                    tf_name: police_exceed_set_dscp
                    type: String
                    description: 'set dscp for exceeding traffic.'
                    example: af31
                  - nxos_name: exceedSetPrecTransmit
                    tf_name: police_exceed_set_precedence
                    type: String
                    description: 'set precedence for exceeding traffic.'
                    enum_values:
                      - routine
                      - priority
                      - immediate
                      - flash
                      - flash-override
                      - critical
                      - internet
                      - network
                    example: routine
                  - nxos_name: exceedSetQosGrpTransmit
                    tf_name: police_exceed_set_qos_group
                    type: Int64
                    description: 'set qos-group for exceeding traffic.'
                    min_int: 0
                    max_int: 7
                    example: 0
                  - nxos_name: pirRate
                    tf_name: police_pir_rate
                    type: Int64
                    description: 'PIR.'
                    min_int: 0
                    max_int: 100000000000
                    example: 10000
                  - nxos_name: pirUnit
                    tf_name: police_pir_unit
                    type: String
                    description: 'PIR unit.'
                    enum_values:
                      - unspecified
                      - bps
                      - kbps
                      - mbps
                      - gbps
                      - pps
                      - pct
                    example: mbps
                  - nxos_name: violateAction
                    tf_name: police_violate_action
                    type: String
                    description: 'Violate action.'
                    enum_values:
                      - unspecified
                      - transmit
                      - drop
                      - set-cos-transmit
                      - set-dscp-transmit
                      - set-prec-transmit
                      - set-qos-transmit
                    example: set-dscp-transmit
                  - nxos_name: violateSetCosTransmit
                    tf_name: police_violate_set_cos
                    type: Int64
                    description: 'set cos for violating traffic.'
                    min_int: 0
                    max_int: 7
                    example: 0
                  - nxos_name: violateSetDscpTransmit
                    tf_name: police_violate_set_dscp
                    type: String
                    description: 'set dscp for violating traffic.'
                    example: cs1
                  - nxos_name: violateSetPrecTransmit
                    tf_name: police_violate_set_precedence
                    type: String
                    description: 'set precedence for violating traffic.'
                    enum_values:
                      - routine
                      - priority
                      - immediate
                      - flash
                      - flash-override
                      - critical
                      - internet
                      - network
                    example: routine
                  - nxos_name: violateSetQosGrpTransmit
                    tf_name: police_violate_set_qos_group
                    type: Int64
                    description: 'set qos-group for violating traffic.'
                    min_int: 0
                    max_int: 7
                    example: 0
  - class_name: ipqosServPol
    doc_path: Qos/ipqos:ServPol/
    rn: policy
    type: single
    no_delete: true
    child_classes:
      - class_name: ipqosIngress
        doc_path: Qos/ipqos:Ingress/
        rn: in
        type: single
        no_delete: true
        child_classes:
          - class_name: ipqosIf
            doc_path: Qos/ipqos:If/
            rn: intf-[%s]
            type: list
            tf_name: policy_interface_in
            description: 'List of interfaces with ingress QoS policy assignments.'
            attributes:
              - nxos_name: name
                tf_name: interface_id
                type: String
                id: true
                description: 'Must match first field in the output of `show intf brief`. Example: `eth1/1`.'
                example: eth1/10
            child_classes:
              - class_name: ipqosInst
                doc_path: Qos/ipqos:Inst/
                rn: pmap
                type: single
                tf_name: policy_map
                description: 'Ingress QoS policy map assignment.'
                attributes:
                  - nxos_name: name
                    tf_name: policy_map_name
                    type: String
                    description: 'Policy-map Name.'
                    example: PM1
                  - nxos_name: stats
                    tf_name: policy_map_statistics
                    type: Bool
                    description: 'Turn on/off statistics.'
                    example: false
test_prerequisites:
  - dn: sys/acl/ipv4/name-[ACL1]
    class_name: ipv4aclACL
    attributes:
      - name: name
        value: ACL1
