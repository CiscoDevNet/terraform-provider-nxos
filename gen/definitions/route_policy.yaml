---
name: Route Policy
class_name: rpmEntity
dn: sys/rpm
ds_description: This data source can read the route policy configuration on NX-OS devices, including IPv4 and IPv6 prefix lists and route maps with match and set criteria.
res_description: This resource can manage the route policy configuration on NX-OS devices, including IPv4 and IPv6 prefix lists and route maps with match and set criteria.
doc_path: Routing%20and%20Forwarding/rpm:Entity/
doc_category: Routing
attributes:
  - nxos_name: adminSt
    tf_name: admin_state
    type: String
    description: 'The administrative state of the object or policy.'
    enum_values:
      - enabled
      - disabled
    example: enabled
    exclude_test: true
child_classes:
  - class_name: rtpfxRuleV4
    doc_path: Routing%20and%20Forwarding/rtpfx:RuleV4/
    rn: pfxlistv4-[%s]
    type: list
    tf_name: ipv4_prefix_lists
    description: 'List of IPv4 Prefix Lists.'
    attributes:
      - nxos_name: name
        tf_name: name
        type: String
        id: true
        description: 'Object name.'
        example: 'PREFIX_LIST1'
      - nxos_name: descr
        tf_name: description
        type: String
        description: 'Description.'
        example: 'My prefix list'
      - nxos_name: mode
        tf_name: mode
        type: String
        description: 'Mode of ipv4 prefix-list.'
        enum_values:
          - IPV4
        example: IPV4
    child_classes:
      - class_name: rtpfxEntry
        doc_path: Routing%20and%20Forwarding/rtpfx:Entry/
        rn: ent-%v
        type: list
        tf_name: entries
        description: 'IPv4 Prefix List entries.'
        attributes:
          - nxos_name: order
            tf_name: order
            type: Int64
            id: true
            description: "Order."
            min_int: 1
            max_int: 4294967294
            example: 10
          - nxos_name: action
            tf_name: action
            type: String
            description: "Action."
            enum_values:
              - deny
              - permit
            example: permit
          - nxos_name: criteria
            tf_name: criteria
            type: String
            description: "Criteria."
            enum_values:
              - exact
              - inexact
            example: inexact
          - nxos_name: pfx
            tf_name: prefix
            type: String
            description: "Specifies the OSPF route prefix."
            example: 192.168.1.0/24
          - nxos_name: fromPfxLen
            tf_name: from_range
            type: Int64
            description: "The start of a range used to describe the prefix length if the criteria is not an exact match."
            min_int: 0
            max_int: 128
            example: 26
          - nxos_name: toPfxLen
            tf_name: to_range
            type: Int64
            description: "The end of a range to describe the prefix length if the criteria is not an exact match."
            min_int: 0
            max_int: 128
            example: 32
          - nxos_name: mask
            tf_name: mask
            type: String
            description: "Mask."
            example: 255.255.255.0
  - class_name: rtpfxRuleV6
    doc_path: Routing%20and%20Forwarding/rtpfx:RuleV6/
    rn: pfxlistv6-[%s]
    type: list
    tf_name: ipv6_prefix_lists
    description: 'List of IPv6 Prefix Lists.'
    attributes:
      - nxos_name: name
        tf_name: name
        type: String
        id: true
        description: 'Object name.'
        example: 'PREFIX_LIST_V6_1'
      - nxos_name: descr
        tf_name: description
        type: String
        description: 'descr.'
        example: 'My IPv6 prefix list'
      - nxos_name: mode
        tf_name: mode
        type: String
        description: 'Mode of ipv6 prefix-list.'
        enum_values:
          - IPV6
        example: IPV6
    child_classes:
      - class_name: rtpfxEntry
        doc_path: Routing%20and%20Forwarding/rtpfx:Entry/
        rn: ent-%v
        type: list
        tf_name: entries
        description: 'IPv6 Prefix List entries.'
        attributes:
          - nxos_name: order
            tf_name: order
            type: Int64
            id: true
            description: "Order."
            min_int: 1
            max_int: 4294967294
            example: 10
          - nxos_name: action
            tf_name: action
            type: String
            description: "Action."
            enum_values:
              - deny
              - permit
            example: permit
          - nxos_name: criteria
            tf_name: criteria
            type: String
            description: "Criteria."
            enum_values:
              - exact
              - inexact
            example: inexact
          - nxos_name: pfx
            tf_name: prefix
            type: String
            description: "Specifies the OSPF route prefix."
            example: '2001:db8::/32'
          - nxos_name: fromPfxLen
            tf_name: from_range
            type: Int64
            description: "The start of a range used to describe the prefix length if the criteria is not an exact match."
            min_int: 0
            max_int: 128
            example: 48
          - nxos_name: toPfxLen
            tf_name: to_range
            type: Int64
            description: "The end of a range to describe the prefix length if the criteria is not an exact match."
            min_int: 0
            max_int: 128
            example: 64
          - nxos_name: mask
            tf_name: mask
            type: String
            description: "Mask."
            example: 'ffff:ff00::'
  - class_name: rtmapRule
    doc_path: Routing%20and%20Forwarding/rtmap:Rule/
    rn: rtmap-[%s]
    type: list
    tf_name: route_maps
    description: 'List of Route Maps.'
    attributes:
      - nxos_name: name
        tf_name: name
        type: String
        description: 'Object name.'
        id: true
        example: ROUTE_MAP1
      - nxos_name: pbrStatistics
        tf_name: pbr_statistics
        type: String
        description: 'Route map pbr-statistics.'
        enum_values:
          - enabled
          - disabled
        example: enabled
    child_classes:
      - class_name: rtmapEntry
        doc_path: Routing%20and%20Forwarding/rtmap:Entry/
        rn: ent-%v
        type: list
        tf_name: entries
        description: 'List of Route Map Entries.'
        attributes:
          - nxos_name: order
            tf_name: order
            type: Int64
            description: 'Order.'
            min_int: 0
            max_int: 65535
            example: 10
            id: true
          - nxos_name: action
            tf_name: action
            type: String
            description: 'Action.'
            enum_values:
              - deny
              - permit
            example: permit
          - nxos_name: descr
            tf_name: description
            type: String
            description: 'Description.'
            example: 'My route map entry'
          - nxos_name: dropOnFailV4
            tf_name: drop_on_fail_v4
            type: String
            description: 'Drop On Fail V4 for v4 nexthop.'
            enum_values:
              - enabled
              - disabled
            example: disabled
          - nxos_name: dropOnFailV6
            tf_name: drop_on_fail_v6
            type: String
            description: 'Drop On Fail V6 for v6 nexthop.'
            enum_values:
              - enabled
              - disabled
            example: disabled
          - nxos_name: forceOrderV4
            tf_name: force_order_v4
            type: String
            description: 'Force Order V4.'
            enum_values:
              - enabled
              - disabled
            example: disabled
          - nxos_name: forceOrderV6
            tf_name: force_order_v6
            type: String
            description: 'Force Order V6.'
            enum_values:
              - enabled
              - disabled
            example: disabled
          - nxos_name: loadShareV4
            tf_name: load_share_v4
            type: String
            description: 'Load Sharing V4.'
            enum_values:
              - enabled
              - disabled
            example: disabled
          - nxos_name: loadShareV6
            tf_name: load_share_v6
            type: String
            description: 'Load Sharing V6.'
            enum_values:
              - enabled
              - disabled
            example: disabled
          - nxos_name: setDefaultNhV4
            tf_name: set_default_next_hop_v4
            type: String
            description: 'Default V4 Next-hop Address.'
            enum_values:
              - enabled
              - disabled
            example: disabled
          - nxos_name: setDefaultNhV6
            tf_name: set_default_next_hop_v6
            type: String
            description: 'Default V6 Next-hop Address.'
            enum_values:
              - enabled
              - disabled
            example: disabled
          - nxos_name: setVrfV4
            tf_name: set_vrf_v4
            type: String
            description: 'Enable vrf based set ipv4 next-hop resolution.'
            enum_values:
              - enabled
              - disabled
            example: disabled
          - nxos_name: setVrfV6
            tf_name: set_vrf_v6
            type: String
            description: 'Enable vrf based set ipv6 next-hop resolution.'
            enum_values:
              - enabled
              - disabled
            example: disabled
          - nxos_name: verifyAvailabilityV4
            tf_name: verify_availability_v4
            type: String
            description: 'Next Hop with V4 Verify Availability.'
            enum_values:
              - enabled
              - disabled
            example: disabled
          - nxos_name: verifyAvailabilityV6
            tf_name: verify_availability_v6
            type: String
            description: 'Next Hop with V6 Verify Availability.'
            enum_values:
              - enabled
              - disabled
            example: disabled
        child_classes:
          - class_name: rtmapSetPolicyTag
            doc_path: Routing%20and%20Forwarding/rtmap:SetPolicyTag/
            rn: spctag
            type: single
            tf_name: set_policy_tag
            description: 'Set Policy Tag.'
            attributes:
              - nxos_name: policyTag
                tf_name: set_policy_tag
                type: Int64
                write_only: true
                description: 'Policy Classifier Tag.'
                min_int: 0
                max_int: 65535
                example: 100
          - class_name: rtmapMatchRtDst
            doc_path: Routing%20and%20Forwarding/rtmap:MatchRtDst/
            rn: mrtdst
            type: single
            tf_name: match_route
            description: 'Match Route configuration.'
            child_classes:
              - class_name: rtmapRsRtDstAtt
                doc_path: Routing%20and%20Forwarding/rtmap:RsRtDstAtt/
                rn: rsrtDstAtt-[%s]
                type: list
                tf_name: match_route_prefix_lists
                description: 'List of Match Route Prefix Lists.'
                attributes:
                  - nxos_name: tDn
                    tf_name: prefix_list_dn
                    type: String
                    description: "DN of Prefix List. For example: `sys/rpm/pfxlistv4-[PREFIX_LIST1]`"
                    example: sys/rpm/pfxlistv4-[PREFIX_LIST1]
                    id: true
              - class_name: rtmapRsRtDstAccAtt
                doc_path: Routing%20and%20Forwarding/rtmap:RsRtDstAccAtt/
                rn: rtrtDstAccAtt-[%s]
                type: list
                tf_name: match_route_access_lists
                description: 'List of Match Route Access Lists.'
                attributes:
                  - nxos_name: tDn
                    tf_name: access_list_dn
                    type: String
                    description: 'DN of Access List. For example: `sys/acl/ipv4/name-[ACL1]` or `sys/rpm/accesslist-[1.2.3.4/32]`.'
                    example: sys/rpm/accesslist-[1.2.3.4/32]
                    id: true
          - class_name: rtmapMatchRtDstV6
            doc_path: Routing%20and%20Forwarding/rtmap:MatchRtDstV6/
            rn: mrtdstv6
            type: single
            tf_name: match_route_ipv6
            description: 'Match IPv6 Route configuration.'
            exclude_test: true
            child_classes:
              - class_name: rtmapRsRtDstV6AccAtt
                doc_path: Routing%20and%20Forwarding/rtmap:RsRtDstV6AccAtt/
                rn: rsrtDstV6AccAtt-[%s]
                type: list
                tf_name: match_route_ipv6_access_lists
                description: 'List of Match IPv6 Route Access Lists.'
                attributes:
                  - nxos_name: tDn
                    tf_name: access_list_dn
                    type: String
                    description: 'DN of IPv6 Access List. For example: `sys/rpm/accesslist-[ACL1]`.'
                    example: sys/rpm/accesslist-[ACL1]
                    id: true
          - class_name: rtmapSetRegComm
            doc_path: Routing%20and%20Forwarding/rtmap:SetRegComm/
            rn: sregcomm
            type: single
            tf_name: set_regular_community
            description: 'Set Community configuration.'
            attributes:
              - nxos_name: additive
                tf_name: set_regular_community_additive
                type: String
                description: "Add To Existing Community."
                enum_values:
                  - enabled
                  - disabled
                example: disabled
              - nxos_name: noCommAttr
                tf_name: set_regular_community_no_community
                type: String
                description: "No Community Attribute."
                enum_values:
                  - enabled
                  - disabled
                example: disabled
              - nxos_name: setCriteria
                tf_name: set_regular_community_criteria
                type: String
                description: "Criteria."
                enum_values:
                  - none
                  - append
                  - replace
                  - igp
                  - pre-bestpath
                example: none
            child_classes:
              - class_name: rtregcomItem
                doc_path: Routing%20and%20Forwarding/rtregcom:Item/
                rn: item-%s
                type: list
                tf_name: set_regular_community_items
                description: 'List of Set Community Items.'
                attributes:
                  - nxos_name: community
                    tf_name: community
                    type: String
                    description: "Community."
                    example: regular:as2-nn2:65001:123
                    id: true
                  - nxos_name: descr
                    tf_name: description
                    type: String
                    description: "Description of the specified attribute."
                    example: 'My community'
                    exclude_test: true
                  - nxos_name: name
                    tf_name: name
                    type: String
                    description: "Object name."
                    example: 'COMMUNITY1'
                    exclude_test: true
          - class_name: rtmapSetLargeComm
            doc_path: Routing%20and%20Forwarding/rtmap:SetLargeComm/
            rn: slargecomm
            type: single
            tf_name: set_large_community
            description: 'Set Large Community configuration.'
            attributes:
              - nxos_name: additive
                tf_name: set_large_community_additive
                type: String
                description: 'Add To Existing Large Community.'
                enum_values:
                  - enabled
                  - disabled
                example: enabled
              - nxos_name: noCommAttr
                tf_name: set_large_community_no_community
                type: String
                description: 'No Large Community Attribute.'
                enum_values:
                  - enabled
                  - disabled
                example: disabled
            child_classes:
              - class_name: rtlargecomItem
                doc_path: Routing%20and%20Forwarding/rtlargecom:Item/
                rn: item-[%s]
                type: list
                tf_name: set_large_community_items
                description: 'List of Set Large Community Items.'
                attributes:
                  - nxos_name: community
                    tf_name: community
                    type: String
                    id: true
                    description: 'Community. For example: `large:xx-yy-zz:65000:5:5`.'
                    example: large:xx-yy-zz:65000:5:5
          - class_name: rtmapMatchRtTag
            doc_path: Routing%20and%20Forwarding/rtmap:MatchRtTag/
            rn: mrttag-%v
            type: list
            tf_name: match_tags
            description: 'List of Match Tags.'
            attributes:
              - nxos_name: tag
                tf_name: tag
                type: Int64
                min_int: 0
                max_int: 4294967295
                description: "The color of a policy label."
                id: true
                example: 12345
          - class_name: rtmapSetMetric
            doc_path: Routing%20and%20Forwarding/rtmap:SetMetric/
            rn: smetric
            type: single
            tf_name: set_metric
            description: 'A set rule based on metric.'
            attributes:
              - nxos_name: isBGP
                tf_name: set_metric_is_bgp
                type: Bool
                description: 'is BGP config.'
                example: false
              - nxos_name: metric
                tf_name: set_metric
                type: String
                description: 'Specifies the ISIS interface metric.'
                example: '100'
              - nxos_name: metricD
                tf_name: set_metric_delay
                type: Int64
                description: 'Metric delay.'
                min_int: 0
                max_int: 4294967295
                example: 10
              - nxos_name: metricL
                tf_name: set_metric_load
                type: Int64
                description: 'Metric load.'
                min_int: 0
                max_int: 255
                example: 10
              - nxos_name: metricM
                tf_name: set_metric_mtu
                type: Int64
                description: 'Metric mtu.'
                min_int: 0
                max_int: 16777215
                example: 1500
              - nxos_name: metricR
                tf_name: set_metric_reliability
                type: Int64
                description: 'Metric reliability.'
                min_int: 0
                max_int: 255
                example: 100
          - class_name: rtmapSetMetricType
            doc_path: Routing%20and%20Forwarding/rtmap:SetMetricType/
            rn: smetrict
            type: single
            tf_name: set_metric_type
            description: 'Set Metric Type.'
            attributes:
              - nxos_name: metricT
                tf_name: set_metric_type
                type: String
                description: 'Metric Type.'
                enum_values:
                  - type-1
                  - type-2
                  - internal
                  - external
                example: type-1
          - class_name: rtmapSetNhPeerAddr
            doc_path: Routing%20and%20Forwarding/rtmap:SetNhPeerAddr/
            rn: nhpa
            type: single
            tf_name: set_next_hop
            description: 'Set Nexthop Peer Address configuration.'
            attributes:
              - nxos_name: v4PeerAddr
                tf_name: set_next_hop_v4_peer_address
                type: String
                description: 'Set Next Hop V4 Peer Address.'
                enum_values:
                  - enabled
                  - disabled
                example: disabled
              - nxos_name: v4RedistUnchange
                tf_name: set_next_hop_v4_redist_unchanged
                type: String
                description: 'Set IPv4 Next Hop Redist Unchanged.'
                enum_values:
                  - enabled
                  - disabled
                example: enabled
              - nxos_name: v4Unchange
                tf_name: set_next_hop_v4_unchanged
                type: String
                description: 'Set IPv4 Next Hop Unchanged.'
                enum_values:
                  - enabled
                  - disabled
                example: enabled
              - nxos_name: v6PeerAddr
                tf_name: set_next_hop_v6_peer_address
                type: String
                description: 'Set Next Hop V6 Peer Address.'
                enum_values:
                  - enabled
                  - disabled
                example: disabled
              - nxos_name: v6RedistUnchange
                tf_name: set_next_hop_v6_redist_unchanged
                type: String
                description: 'Set IPv6 Next Hop Redist Unchanged.'
                enum_values:
                  - enabled
                  - disabled
                example: enabled
              - nxos_name: v6Unchange
                tf_name: set_next_hop_v6_unchanged
                type: String
                description: 'Set IPv6 Next Hop Unchanged.'
                enum_values:
                  - enabled
                  - disabled
                example: enabled
          - class_name: rtmapSetPref
            doc_path: Routing%20and%20Forwarding/rtmap:SetPref/
            rn: spref
            type: single
            tf_name: set_local_preference
            description: 'A set rule based on preference.'
            attributes:
              - nxos_name: localPref
                tf_name: set_local_preference
                type: Int64
                description: 'Local Preference.'
                min_int: 0
                max_int: 4294967295
                example: 100
          - class_name: rtmapSetPathSelection
            doc_path: Routing%20and%20Forwarding/rtmap:SetPathSelection/
            rn: spselect
            type: single
            tf_name: set_path_selection
            description: 'Set As Path Tag.'
            attributes:
              - nxos_name: psAdvertise
                tf_name: set_path_selection_advertise
                type: String
                description: 'Specifies BGP path Advertise.'
                enum_values:
                  - unspecified
                  - ps-all
                  - ps-bestplus
                  - ps-best2
                  - ps-mpath
                example: ps-all
          - class_name: rtmapSetEvpn
            doc_path: Routing%20and%20Forwarding/rtmap:SetEvpn/
            rn: sevpn
            type: single
            tf_name: set_evpn
            description: 'Set Evpn Gateway Ip Addr and Ether Tag.'
            attributes:
              - nxos_name: gwType
                tf_name: set_evpn_gateway_type
                type: String
                description: 'EVPN Gateway Address Type.'
                enum_values:
                  - ip-address
                  - nexthop
                example: ip-address
                exclude_test: true
              - nxos_name: ip
                tf_name: set_evpn_gateway_ip
                type: String
                description: 'EVPN Gateway IP Address.'
                example: 10.1.1.1
                exclude_test: true
          - class_name: rtmapMatchRtNh
            doc_path: Routing%20and%20Forwarding/rtmap:MatchRtNh/
            rn: mrtnh
            type: single
            tf_name: match_next_hop
            description: 'A match rule based on route next hops.'
            child_classes:
              - class_name: rtmapRsRtNhAtt
                doc_path: Routing%20and%20Forwarding/rtmap:RsRtNhAtt/
                rn: rtrtNhAtt-[%s]
                type: list
                tf_name: match_next_hop_prefix_lists
                description: 'List of Match Next Hop Prefix Lists.'
                attributes:
                  - nxos_name: tDn
                    tf_name: prefix_list_dn
                    type: String
                    description: 'DN of Prefix List. For example: `sys/rpm/pfxlistv4-[PREFIX_LIST1]`.'
                    example: sys/rpm/pfxlistv4-[PREFIX_LIST1]
                    id: true
          - class_name: rtmapMatchRegComm
            doc_path: Routing%20and%20Forwarding/rtmap:MatchRegComm/
            rn: mregcomm
            type: single
            tf_name: match_regular_community
            description: 'A match rule based on regular communities.'
            attributes:
              - nxos_name: criteria
                tf_name: match_regular_community_criteria
                type: String
                description: 'Criteria.'
                enum_values:
                  - exact
                  - sub-group
                example: exact
            child_classes:
              - class_name: rtmapRsRegCommAtt
                doc_path: Routing%20and%20Forwarding/rtmap:RsRegCommAtt/
                rn: rsregCommAtt-[%s]
                type: list
                tf_name: match_regular_community_lists
                description: 'List of Match Regular Community Lists.'
                attributes:
                  - nxos_name: tDn
                    tf_name: community_list_dn
                    type: String
                    description: 'DN of Community List. For example: `sys/rpm/rtregcom-[COMMUNITY_LIST1]`.'
                    example: sys/rpm/rtregcom-[COMMUNITY_LIST1]
                    id: true
          - class_name: rtmapMatchExtComm
            doc_path: Routing%20and%20Forwarding/rtmap:MatchExtComm/
            rn: mextcomm
            type: single
            tf_name: match_extended_community
            description: 'A match rule based on extended communities.'
            attributes:
              - nxos_name: criteria
                tf_name: match_extended_community_criteria
                type: String
                description: 'Criteria.'
                enum_values:
                  - exact
                  - sub-group
                example: exact
            child_classes:
              - class_name: rtmapRsExtCommAtt
                doc_path: Routing%20and%20Forwarding/rtmap:RsExtCommAtt/
                rn: rsextCommAtt-[%s]
                type: list
                tf_name: match_extended_community_lists
                description: 'List of Match Extended Community Lists.'
                attributes:
                  - nxos_name: tDn
                    tf_name: extended_community_list_dn
                    type: String
                    description: 'DN of Extended Community List. For example: `sys/rpm/rtextcom-[EXT_COMMUNITY_LIST1]`.'
                    example: sys/rpm/rtextcom-[EXT_COMMUNITY_LIST1]
                    id: true
          - class_name: rtmapMatchLargeComm
            doc_path: Routing%20and%20Forwarding/rtmap:MatchLargeComm/
            rn: mlargecomm
            type: single
            tf_name: match_large_community
            description: 'A match rule based on large communities.'
            attributes:
              - nxos_name: criteria
                tf_name: match_large_community_criteria
                type: String
                description: 'Criteria.'
                enum_values:
                  - exact
                  - sub-group
                example: exact
            child_classes:
              - class_name: rtmapRsLargeCommAtt
                doc_path: Routing%20and%20Forwarding/rtmap:RsLargeCommAtt/
                rn: rslargeCommAtt-[%s]
                type: list
                tf_name: match_large_community_lists
                description: 'List of Match Large Community Lists.'
                attributes:
                  - nxos_name: tDn
                    tf_name: large_community_list_dn
                    type: String
                    description: 'DN of Large Community List. For example: `sys/rpm/rtlargecom-[LARGE_COMMUNITY_LIST1]`.'
                    example: sys/rpm/rtlargecom-[LARGE_COMMUNITY_LIST1]
                    id: true
          - class_name: rtmapMatchAsPathAccessList
            doc_path: Routing%20and%20Forwarding/rtmap:MatchAsPathAccessList/
            rn: mrtacclist
            type: single
            tf_name: match_as_path
