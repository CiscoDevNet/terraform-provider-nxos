                    example: TF_COUNTER
                  - nxos_name: counterOp
                    tf_name: counter_operation
                    type: String
                    enum_values:
                      - nop
                      - set
                      - inc
                      - dec
                    description: 'Specify the operator to be applied.'
                    example: inc
                  - nxos_name: counterValue
                    tf_name: counter_value
                    type: String
                    description: 'Specify the value to be applied to the counter.'
                    example: '1'
              - class_name: evmsActionEventDefault
                doc_path: System/evms:ActionEventDefault/
                rn: eventdefault
                type: single
                tf_name: event_default
                description: 'Do default action for the event.'
                exclude_test: true
                attributes:
                  - nxos_name: actioneventdefaultstatus
                    tf_name: event_default
                    type: Bool
                    description: 'Do default action for the event.'
                    example: true
              - class_name: evmsActionExceptionLog
                doc_path: System/evms:ActionExceptionLog/
                rn: exceptionlog
                type: single
                tf_name: exception_log
                description: 'Exception log action for modules.'
                exclude_test: true
                attributes:
                  - nxos_name: moduleNumber
                    tf_name: exception_log_module
                    type: String
                    description: 'Specify module number: interger module number or a $predefine environment name.'
                    example: '1'
                  - nxos_name: sysErr
                    tf_name: exception_log_syserr
                    type: String
                    description: 'Specify syserr code : hex value or a $predefine environment name.'
                    example: '0x1'
                  - nxos_name: devId
                    tf_name: exception_log_device_id
                    type: String
                    description: 'Specify device ID : interger value or a $predefine environment name.'
                    example: '1'
                  - nxos_name: errType
                    tf_name: exception_log_error_type
                    type: String
                    description: 'Specify error type : interger value or a $predefine environment name.'
                    example: '1'
                  - nxos_name: errCode
                    tf_name: exception_log_error_code
                    type: String
                    description: 'Specify error code : interger value or a $predefine environment name.'
                    example: '1'
                  - nxos_name: phyLayer
                    tf_name: exception_log_phy_layer
                    type: String
                    description: 'Specify phy layer : interger value or a $predefine environment name.'
                    example: '1'
                  - nxos_name: ports
                    tf_name: exception_log_ports
                    type: String
                    description: 'Specify list of ports.'
                    example: '1'
                  - nxos_name: hardError
                    tf_name: exception_log_hard_error
                    type: String
                    enum_values:
                      - soft_error
                      - hard_error
                      - soft_error_resettable
                      - soft_error_reset_replay_all_cfg
                      - soft_error_diag_failure
                    description: 'Specify hard error 0..4.'
                    example: soft_error
                  - nxos_name: desc
                    tf_name: exception_log_description
                    type: String
                    description: 'Specify string data for error description.'
                    example: Terraform
              - class_name: evmsActionForceShut
                doc_path: System/evms:ActionForceShut/
                rn: forceshut
                type: single
                tf_name: force_shutdown
                description: 'Force shutdown action. Excluded from the acceptance tests as it would shut down modules if triggered.'
                exclude_test: true
                attributes:
                  - nxos_name: moduleNumber
                    tf_name: force_shutdown_module
                    type: String
                    description: 'Specify module number: all, interger module number or a $predefine environment name.'
                    example: '1'
                  - nxos_name: resetReason
                    tf_name: force_shutdown_reset_reason
                    type: String
                    description: 'Reset reason for action forceshut. Must be enclosed in double quotes.'
                    example: '"maintenance"'
              - class_name: evmsActionOverBudgetShut
                doc_path: System/evms:ActionOverBudgetShut/
                rn: overbudgetshut
                type: single
                tf_name: overbudget_shutdown
                description: 'Shut down the specified line cards due to power over budget. Excluded from the acceptance tests as it would shut down modules if triggered.'
                exclude_test: true
                attributes:
                  - nxos_name: moduleNumber
                    tf_name: overbudget_shutdown_module
                    type: String
                    description: 'Specify module number: all, interger module number or a $predefine environment name.'
                    example: '1'
              - class_name: evmsActionPolicyDefault
                doc_path: System/evms:ActionPolicyDefault/
                rn: policydefault
                type: single
                tf_name: policy_default
                description: 'Do default action(s) of the policy being overridden. Only applicable to applets overriding a system policy.'
                exclude_test: true
                attributes:
                  - nxos_name: actionpolicydefaultstatus
                    tf_name: policy_default
                    type: Bool
                    description: 'Do default action(s) of the policy being overridden.'
                    example: true
              - class_name: evmsActionPublishEvent
                doc_path: System/evms:ActionPublishEvent/
                rn: publishevent
                type: single
                tf_name: publish_event
                description: 'Publish an application specific event. Requires the `evmed` feature.'
                exclude_test: true
                attributes:
                  - nxos_name: subSystemId
                    tf_name: publish_event_subsystem_id
                    type: Int64
                    min_int: 0
                    max_int: 4294967295
                    description: 'Sub-system ID that will publish the application event.'
                    example: 798
                  - nxos_name: eventType
                    tf_name: publish_event_type
                    type: Int64
                    min_int: 0
                    max_int: 4294967295
                    description: 'Event type within the specified sub-system.'
                    example: 1
                  - nxos_name: arg1
                    tf_name: publish_event_argument_1
                    type: String
                    description: 'User specified data to be passed when the event is published(arg1).'
                    example: a
                  - nxos_name: arg2
                    tf_name: publish_event_argument_2
                    type: String
                    description: 'User specified data to be passed when the event is published(arg2).'
                    example: b
                  - nxos_name: arg3
                    tf_name: publish_event_argument_3
                    type: String
                    description: 'User specified data to be passed when the event is published(arg3).'
                    example: c
                  - nxos_name: arg4
                    tf_name: publish_event_argument_4
                    type: String
                    description: 'User specified data to be passed when the event is published(arg4).'
                    example: d
              - class_name: evmsActionReload
                doc_path: System/evms:ActionReload/
                rn: reload
                type: single
                tf_name: reload
                description: 'Reload module action. Excluded from the acceptance tests as it would reload modules if triggered.'
                exclude_test: true
                attributes:
                  - nxos_name: moduleNumber
                    tf_name: reload_module
                    type: String
                    description: 'Specify module number: all, interger module number or a $predefine environment name.'
                    example: '1'
              - class_name: evmsActionSnmpTrap
                doc_path: System/evms:ActionSnmpTrap/
                rn: snmptrap
                type: single
                tf_name: snmp_trap
                description: 'Send out an SNMP trap.'
                exclude_test: true
                attributes:
                  - nxos_name: trapstatus
                    tf_name: snmp_trap
                    type: Bool
                    description: 'Enable or Disable snmp trap.'
                    example: true
                  - nxos_name: integerData1
                    tf_name: snmp_trap_integer_data_1
                    type: String
                    description: 'Integer data1 to be included in the payload.'
                    example: '1'
                  - nxos_name: integerData2
                    tf_name: snmp_trap_integer_data_2
                    type: String
                    description: 'Integer data2 to be included in the payload.'
                    example: '2'
                  - nxos_name: stringData
                    tf_name: snmp_trap_string_data
                    type: String
                    description: 'String data to BE included in the payload.'
                    example: Terraform
              - class_name: evmsActionSyslog
                doc_path: System/evms:ActionSyslog/
                rn: syslog
                type: single
                tf_name: syslog
                description: 'Generate a syslog message.'
                exclude_test: true
                attributes:
                  - nxos_name: priority
                    tf_name: syslog_priority
                    type: String
                    description: 'Priority of the syslog message.'
                    example: alerts
                  - nxos_name: message
                    tf_name: syslog_message
                    type: String
                    description: 'Syslog message text.'
                    example: Terraform
test_prerequisites:
  - dn: sys/fm/evmed
    class_name: fmEvmed
    no_delete: true
    attributes:
      - name: adminSt
        value: enabled
additional_tests:
  # replace the correlated tagged events of an applet, collect actions and the policy-default action of an overriding applet
  - |-
    resource "nxos_eem" "test" {
      applets = {
        "TF_APPLET" = {
          correlation_tag_1      = "TF_APPLICATION"
          correlation_operator_1 = "and"
          correlation_tag_2      = "TF_CDP"
          correlation_operator_2 = "and"
          correlation_tag_3      = "TF_MODULE"
          correlation_operator_3 = "and"
          correlation_tag_4      = "TF_NONE"
          application_events = {
            "TF_APPLICATION" = {
              subsystem_id = 798
              type         = 1
            }
          }
          cdp_events = {
            "TF_CDP" = {
              interface = "eth1/10"
              operation = "add"
            }
          }
          module_events = {
            "TF_MODULE" = {
              module = "1"
              status = "online"
            }
          }
          none_events = {
            "TF_NONE" = {
              enabled = true
            }
          }
          actions = {
            "1.0" = {
              collect_yaml_file    = "bootflash:collect.yaml"
              collect_component    = "bgp"
              collect_rate_limit   = 60
              collect_max_triggers = 5
              collect_purge_time   = 3000
            }
            "2.0" = {
              syslog_message = "Terraform"
            }
          }
        }
        "TF_APPLET2" = {
          correlation_tag_1      = "TF_OIR"
          correlation_operator_1 = "and"
          correlation_tag_2      = "TF_TIMER"
          correlation_operator_2 = "and"
          correlation_tag_3      = "TF_TRACK"
          oir_events = {
            "TF_OIR" = {
              device_type   = "fan"
              type          = "remove"
              device_number = 1
            }
          }
          timer_events = {
            "TF_TIMER" = {
              name      = "TF_TIMER"
              cron_time = "0 * * * *"
            }
          }
          track_events = {
            "TF_TRACK" = {
              id    = 10
              state = "down"
            }
          }
          actions = {
            "1.0" = {
              collect_status = "disabled"
            }
          }
        }
        "TF_POLICY_DEFAULT" = {
          override                           = "__pfm_fanbad_any_singlefan"
          policy_default_event_occurrences   = 2
          policy_default_event_time_interval = 60
          actions = {
            "1.0" = {
              policy_default = true
            }
          }
        }
      }
      depends_on = [nxos_dme.PreReq0]
    }
