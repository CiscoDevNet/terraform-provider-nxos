                example: 2
              - nxos_name: sourceVrf
                tf_name: source_vrf
                type: String
                description: 'source-vrf for match.'
                example: default
              - nxos_name: trafficAction
                tf_name: traffic_action
                type: String
                description: 'Traffic action.'
                enum_values:
                  - redirect
                  - drop
                  - exclude
                example: redirect
              - nxos_name: vlans
                tf_name: vlans
                type: String
                description: 'VLANs for layer-2 match.'
                example: '200'
                exclude_test: true
            child_classes:
              - class_name: epbrEpbrMatchSeq
                doc_path: Routing%20and%20Forwarding/epbr:EpbrMatchSeq/
                rn: seq-%v
                type: list
                tf_name: sequences
                description: 'List of ePBR policy match sequences.'
                attributes:
                  - nxos_name: seqno
                    tf_name: sequence_number
                    type: Int64
                    id: true
                    description: 'Sequence number.'
                    example: 10
                  - nxos_name: name
                    tf_name: service
                    type: String
                    description: 'The name of the service.'
                    example: SVC3
                  - nxos_name: action
                    tf_name: action
                    type: String
                    description: 'route action for traffic in forward direction.'
                    enum_values:
                      - redirect
                      - route
                    example: route
                    exclude_test: true
                  - nxos_name: failaction
                    tf_name: fail_action
                    type: String
                    description: 'Fail action.'
                    enum_values:
                      - nofailaction
                      - bypass
                      - forward
                      - drop
                    example: drop
                  - nxos_name: lbMethod
                    tf_name: load_balance_method
                    type: String
                    description: 'load-balance method.'
                    enum_values:
                      - noLBMethod
                      - src
                      - dst
                      - src-dst-ip-proto
                    example: dst
                    exclude_test: true
