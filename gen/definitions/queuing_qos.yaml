---
name: Queuing QoS
class_name: ipqosQueuing
dn: sys/ipqos/queuing
no_delete: true
ds_description: This data source can read the queuing QoS configuration on NX-OS devices, including policy maps with class-based queuing priorities, bandwidth allocation, and system egress policy assignments.
res_description: This resource can manage the queuing QoS configuration on NX-OS devices, including policy maps with class-based queuing priorities, bandwidth allocation, and system egress policy assignments.
doc_path: Qos/ipqos:Queuing/
doc_category: Quality of Service
child_classes:
  - class_name: ipqosPMapEntity
    doc_path: Qos/ipqos:PMapEntity/
    rn: p
    type: single
    no_delete: true
    child_classes:
      - class_name: ipqosPMapInst
        doc_path: Qos/ipqos:PMapInst/
        rn: name-%s
        type: list
        tf_name: policy_maps
        description: 'List of policy maps.'
        attributes:
          - nxos_name: name
            tf_name: name
            type: String
            id: true
            description: 'Name of policy-map.'
            example: PM1
          - nxos_name: matchType
            tf_name: match_type
            type: String
            description: 'Match-any, match-all or match-first.'
            enum_values:
              - match-any
              - match-all
              - match-first
            example: match-any
        child_classes:
          - class_name: ipqosMatchCMap
            doc_path: Qos/ipqos:MatchCMap/
            rn: cmap-%s
            type: list
            tf_name: match_class_maps
            description: 'List of match class maps.'
            attributes:
              - nxos_name: name
                tf_name: name
                type: String
                id: true
                description: 'Match using class-map.'
                example: c-out-q1
              - nxos_name: nextCMap
                tf_name: next_class_map
                type: String
                description: 'Insert before the given class-map.'
                example: c-out-q2
                exclude_test: true
              - nxos_name: prevCMap
                tf_name: previous_class_map
                type: String
                description: 'Insert after the given class-map.'
                example: c-out-q2
                exclude_test: true
            child_classes:
              - class_name: ipqosPriority
                doc_path: Qos/ipqos:Priority/
                rn: prio
                type: single
                tf_name: priority
                description: 'Priority configuration.'
                attributes:
                  - nxos_name: level
                    tf_name: priority
                    type: Int64
                    description: 'Optional priority level.'
                    min_int: 1
                    max_int: 8
                    example: 3
              - class_name: ipqosSetRemBW
                doc_path: Qos/ipqos:SetRemBW/
                rn: setRemBW
                type: single
                tf_name: remaining_bandwidth
                description: 'Remaining bandwidth configuration.'
                attributes:
                  - nxos_name: val
                    tf_name: remaining_bandwidth
                    type: Int64
                    description: 'Remaining bandwidth.'
                    min_int: 0
                    max_int: 100
                    example: 10
                    exclude_test: true
              - class_name: ipqosRandomDetect
                doc_path: Qos/ipqos:RandomDetect/
                rn: RandDet
                type: single
                tf_name: random_detect
                description: 'WRED/ECN random detect configuration.'
                attributes:
                  - nxos_name: capAverage
                    tf_name: cap_average
                    type: Bool
                    description: 'cap average.'
                    example: false
                  - nxos_name: dropAvail
                    tf_name: drop_availability
                    type: Int64
                    description: 'drop availability range.'
                    min_int: 0
                    max_int: 100
                    example: 7
                  - nxos_name: ecn
                    tf_name: random_detect_ecn
                    type: Bool
                    description: 'ecn flag.'
                    example: true
                  - nxos_name: maxThreshold
                    tf_name: max_threshold
                    type: Int64
                    description: 'max threshold.'
                    min_int: 0
                    max_int: 52428800
                    example: 3000
                  - nxos_name: maxThresholdUnit
                    tf_name: max_threshold_unit
                    type: String
                    description: 'max threshold.'
                    enum_values:
                      - none
                      - packets
                      - bytes
                      - kbytes
                      - mbytes
                    example: kbytes
                  - nxos_name: minThreshold
                    tf_name: min_threshold
                    type: Int64
                    description: 'min threshold.'
                    min_int: 0
                    max_int: 52428800
                    example: 150
                  - nxos_name: minThresholdUnit
                    tf_name: min_threshold_unit
                    type: String
                    description: 'min threshold.'
                    enum_values:
                      - none
                      - packets
                      - bytes
                      - kbytes
                      - mbytes
                    example: kbytes
                  - nxos_name: optimization
                    tf_name: optimization
                    type: String
                    description: 'random optimization type.'
                    enum_values:
                      - burst
                      - mesh
                      - unknown
                    example: mesh
                  - nxos_name: weight
                    tf_name: weight
                    type: Int64
                    description: 'weight range.'
                    min_int: 0
                    max_int: 15
                    example: 5
              - class_name: ipqosAfd
                doc_path: Qos/ipqos:Afd/
                rn: afd
                type: single
                tf_name: afd
                description: 'Approximate Fair Discard (AFD) configuration.'
                exclude_test: true
                attributes:
                  - nxos_name: ecn
                    tf_name: afd_ecn
                    type: Bool
                    description: 'Approximate Fair Discard ECN flag.'
                    example: true
                  - nxos_name: queueDesiredUnit
                    tf_name: queue_desired_unit
                    type: String
                    description: 'Units for Approximate Fair Discard value.'
                    enum_values:
                      - none
                      - bytes
                      - kbytes
                      - mbytes
                    example: kbytes
                  - nxos_name: queueDesiredVal
                    tf_name: queue_desired
                    type: Int64
                    description: 'Approximate Fair Discard value.'
                    min_int: 1
                    max_int: 52428800
                    example: 150
  - class_name: ipqosServPol
    doc_path: Qos/ipqos:ServPol/
    rn: policy
    type: single
    no_delete: true
    child_classes:
      - class_name: ipqosEgress
        doc_path: Qos/ipqos:Egress/
        rn: out
        type: single
        no_delete: true
        child_classes:
          - class_name: ipqosSystem
            doc_path: Qos/ipqos:System/
            rn: sys
            type: single
            tf_name: policy_system_out
            description: 'Egress system QoS policy assignment.'
            child_classes:
              - class_name: ipqosInst
                doc_path: Qos/ipqos:Inst/
                rn: pmap
                type: single
                tf_name: policy_map
                description: 'Queuing QoS policy system out policy map assignment.'
                attributes:
                  - nxos_name: name
                    tf_name: system_out_policy_map_name
                    type: String
                    description: 'Policy-map Name.'
                    example: PM1
                  - nxos_name: stats
                    tf_name: policy_map_statistics
                    type: Bool
                    description: 'Turn on/off statistics.'
                    example: false
test_prerequisites:
  - dn: sys/ipqos/queuing/p/name-[PM1]
    class_name: ipqosPMapInst
    attributes:
      - name: name
        value: PM1
  - dn: sys/ipqos/queuing/p/name-[PM1]/cmap-[c-out-q1]
    class_name: ipqosMatchCMap
    attributes:
      - name: name
        value: c-out-q1
    dependencies: [0]
  - dn: sys/ipqos/queuing/p/name-[PM1]/cmap-[c-out-q1]/prio
    class_name: ipqosPriority
    no_delete: true
    attributes:
      - name: level
        value: 3
    dependencies: [1]
  - dn: sys/ipqos/queuing/p/name-[PM1]/cmap-[c-out-q2]
    class_name: ipqosMatchCMap
    attributes:
      - name: name
        value: c-out-q2
    dependencies: [0]
  - dn: sys/ipqos/queuing/p/name-[PM1]/cmap-[c-out-q2]/setRemBW
    class_name: ipqosSetRemBW
    no_delete: true
    attributes:
      - name: val
        value: 10
    dependencies: [3]
  - dn: sys/ipqos/queuing/p/name-[PM1]/cmap-[c-out-q3]
    class_name: ipqosMatchCMap
    attributes:
      - name: name
        value: c-out-q3
    dependencies: [0]
  - dn: sys/ipqos/queuing/p/name-[PM1]/cmap-[c-out-q3]/setRemBW
    class_name: ipqosSetRemBW
    no_delete: true
    attributes:
      - name: val
        value: 10
    dependencies: [5]
  - dn: sys/ipqos/queuing/p/name-[PM1]/cmap-[c-out-q-default]
    class_name: ipqosMatchCMap
    attributes:
      - name: name
        value: c-out-q-default
    dependencies: [0]
  - dn: sys/ipqos/queuing/p/name-[PM1]/cmap-[c-out-q-default]/setRemBW
    class_name: ipqosSetRemBW
    no_delete: true
    attributes:
      - name: val
        value: 10
    dependencies: [7]
